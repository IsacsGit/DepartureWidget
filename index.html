<!DOCTYPE html>
<html lang="sv">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Västergöksvägen → Blackeberg</title>
<style>
* {
    box-sizing: border-box;
}

:root {
    --bg-color: #0b0e14;
    --card-bg: #161b22;
    --card-hover: #1f2630;
    --text-primary: #f0f6fc;
    --text-secondary: #8b949e;
    --border-color: #30363d;
    --accent: #2f81f7;
    --green-metro: #238636;
    --bus-color: #1f242c;
    --walk-color: #30363d;
}

html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg-color);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

.app {
    width: 100%;
    max-width: 600px;
    margin: auto;
    min-height: 100vh;
    padding-bottom: 40px;
}

/* HEADER */
.header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(11, 14, 20, 0.9);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 20px;
    border-bottom: 1px solid var(--border-color);
}

.route-header-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 19px;
    font-weight: 700;
}

.route-header-title .arrow {
    color: var(--accent);
}

.route-header-sub {
    margin-top: 4px;
    color: var(--text-secondary);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    font-weight: 600;
}

/* LIST CONTAINER */
.journeys {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

/* JOURNEY CARD */
.journey-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 16px;
    cursor: pointer;
    transition: all 0.15s ease;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
}

.journey-card:hover {
    background: var(--card-hover);
    border-color: var(--text-secondary);
}

.journey-main-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.time-cluster {
    display: flex;
    align-items: baseline;
    gap: 8px;
}

.time-main {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
}

.time-divider {
    color: var(--text-secondary);
    font-weight: 600;
}

.journey-pills-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
}

/* BADGES / PILLS */
.badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
}

.badge.bus {
    background: #2b313b;
    color: #f0f6fc;
}

.badge.metro {
    background: #116329;
    color: #ffffff;
}

.badge.walk {
    background: #30363d;
    color: var(--text-secondary);
    font-weight: 500;
}

.journey-meta-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--border-color);
    font-size: 13px;
    color: var(--text-secondary);
}

.stations-summary {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 70%;
}

.duration-tag {
    font-weight: 600;
    color: var(--text-primary);
}

/* LOADING & ERROR */
.loading {
    padding: 60px 20px;
    text-align: center;
    color: var(--text-secondary);
}

.spinner {
    width: 28px;
    height: 28px;
    margin: 0 auto 14px;
    border: 3px solid var(--border-color);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.error {
    margin: 20px 16px;
    padding: 16px;
    border-radius: 12px;
    background: rgba(248, 81, 73, 0.1);
    border: 1px solid rgba(248, 81, 73, 0.3);
    color: #ff7b72;
    font-size: 14px;
}

/* DETAIL VIEW */
.detail {
    display: none;
    padding: 16px;
}

.detail.visible {
    display: block;
}

.list.hidden {
    display: none;
}

.back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--border-color);
    background: var(--card-bg);
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 12px;
    border-radius: 8px;
    margin-bottom: 16px;
    cursor: pointer;
}

.back-btn:hover {
    background: var(--card-hover);
}

.detail-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 20px;
}

.detail-top-title {
    font-size: 18px;
    font-weight: 800;
    margin-bottom: 2px;
}

.detail-top-sub {
    font-size: 13px;
    color: var(--text-secondary);
}

/* TIMELINE TREE */
.timeline-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.timeline-step {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 14px;
}

.step-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 6px;
}

.step-time {
    font-size: 14px;
    font-weight: 600;
    color: var(--accent);
}

.step-details {
    font-size: 13px;
    color: var(--text-secondary);
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px solid rgba(255,255,255,0.04);
}

.transfer-info-box {
    padding: 8px 12px;
    background: rgba(47, 129, 247, 0.1);
    border-left: 3px solid var(--accent);
    color: var(--text-primary);
    font-size: 13px;
    border-radius: 0 8px 8px 0;
    margin: 4px 0;
}

.detail-footer {
    margin-top: 24px;
    color: var(--text-secondary);
    font-size: 11px;
    text-align: center;
    line-height: 1.4;
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header class="header">
        <div class="route-header-title">
            <span>Västergöksvägen</span>
            <span class="arrow">→</span>
            <span>Blackeberg</span>
        </div>
        <div class="route-header-sub">Realtid & Reseplanerare</div>
    </header>

    <!-- LIST VIEW -->
    <main id="list" class="list">
        <div id="journeys" class="journeys">
            <div class="loading">
                <div class="spinner"></div>
                Söker efter optimala resor...
            </div>
        </div>
    </main>

    <!-- DETAIL VIEW -->
    <main id="detail" class="detail">
        <button id="back" class="back-btn">
            ← Alla avgångar
        </button>

        <div class="detail-card">
            <div id="detailTitle" class="detail-top-title">Resedetaljer</div>
            <div id="detailSubtitle" class="detail-top-sub">Stopp och byten</div>
        </div>

        <div id="detailContent" class="timeline-list"></div>

        <div class="detail-footer">
            Trafikuppgifter levereras via ResRobot.
        </div>
    </main>

</div>

<script>
const WORKER = "https://sl-transit-proxy.haxxerlikeshaxx.workers.dev";
let journeys = [];

function cleanName(name) {
    if (!name) return "";
    return name.replace(/\s*\(Stockholm kn\)/gi, "").trim();
}

function formatTime(timeStr) {
    if (!timeStr) return "";
    // Truncate seconds if format is HH:MM:SS
    const parts = timeStr.split(":");
    if (parts.length >= 2) {
        return `${parts[0]}:${parts[1]}`;
    }
    return timeStr;
}

function escapeHTML(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function calcDurationMinutes(startDateTimeStr, endDateTimeStr) {
    try {
        const start = new Date(startDateTimeStr);
        const end = new Date(endDateTimeStr);
        const diff = Math.round((end - start) / 60000);
        return isNaN(diff) ? null : diff;
    } catch {
        return null;
    }
}

function productForLeg(leg) {
    return Array.isArray(leg.Product) ? leg.Product[0] : leg.Product;
}

function lineForLeg(leg) {
    const p = productForLeg(leg);
    if (!p) return "";
    return p.num || p.line || p.name || "";
}

function isMetro(leg) {
    const p = productForLeg(leg);
    const text = (p?.catOutS || p?.catOut || p?.cat || p?.name || "").toLowerCase();
    return text.includes("metro") || text.includes("tunnel") || text.includes("ult");
}

/* CREATE MAIN CARD */
function createJourneyCard(trip) {
    const legs = trip.LegList?.Leg || [];
    const firstLeg = legs[0];
    const lastLeg = legs[legs.length - 1];

    if (!firstLeg || !lastLeg) return null;

    const origin = firstLeg.Origin;
    const destination = lastLeg.Destination;

    const startTime = formatTime(origin.time);
    const endTime = formatTime(destination.time);

    const startDateTime = `${origin.date || new Date().toISOString().split('T')[0]}T${origin.time}`;
    const endDateTime = `${destination.date || new Date().toISOString().split('T')[0]}T${destination.time}`;
    const totalDuration = calcDurationMinutes(startDateTime, endDateTime);

    let pillsHTML = "";
    let validLegs = legs.filter(l => l.type === "JNY" || l.type === "WALK");

    validLegs.forEach((leg) => {
        if (leg.type === "WALK") {
            const walkSec = parseInt(leg.duration?.replace(/\D/g,'')) || 180;
            const walkMin = Math.max(1, Math.round(walkSec / 60));
            pillsHTML += `<span class="badge walk">Gå (${walkMin} min)</span>`;
        } else {
            const line = lineForLeg(leg);
            const metro = isMetro(leg);
            const typeName = metro ? "T" : "Buss";
            pillsHTML += `<span class="badge ${metro ? 'metro' : 'bus'}">${typeName} ${escapeHTML(line)}</span>`;
        }
    });

    const card = document.createElement("div");
    card.className = "journey-card";
    card.innerHTML = `
        <div class="journey-main-row">
            <div class="time-cluster">
                <span class="time-main">${startTime}</span>
                <span class="time-divider">→</span>
                <span class="time-main">${endTime}</span>
            </div>
            <div class="duration-tag">
                ${totalDuration !== null ? totalDuration + ' min' : ''}
            </div>
        </div>

        <div class="journey-pills-row">
            ${pillsHTML}
        </div>

        <div class="journey-meta-info">
            <span class="stations-summary">${escapeHTML(cleanName(origin.name))} till ${escapeHTML(cleanName(destination.name))}</span>
        </div>
    `;

    card.addEventListener("click", () => showDetail(trip));
    return card;
}

function renderJourneys() {
    const container = document.getElementById("journeys");
    container.innerHTML = "";

    if (!journeys.length) {
        container.innerHTML = `<div class="error">Inga resor hittades för tillfället. Försök igen om en stund.</div>`;
        return;
    }

    journeys.forEach((trip) => {
        const card = createJourneyCard(trip);
        if (card) container.appendChild(card);
    });
}

/* SHOW DETAIL VIEW */
function showDetail(trip) {
    const list = document.getElementById("list");
    const detail = document.getElementById("detail");
    const title = document.getElementById("detailTitle");
    const subtitle = document.getElementById("detailSubtitle");
    const content = document.getElementById("detailContent");

    const legs = trip.LegList?.Leg || [];
    const origin = legs[0]?.Origin;
    const destination = legs[legs.length - 1]?.Destination;

    title.textContent = `${formatTime(origin?.time)} → ${formatTime(destination?.time)}`;
    subtitle.textContent = `${cleanName(origin?.name)} till ${cleanName(destination?.name)}`;

    let html = "";

    legs.forEach((leg, idx) => {
        if (leg.type === "TRSF") {
            return;
        }

        if (leg.type !== "JNY" && leg.type !== "WALK") return;

        const legOrigin = leg.Origin;
        const legDestination = leg.Destination;
        if (!legOrigin || !legDestination) return;

        const depTime = formatTime(legOrigin.time);
        const arrTime = formatTime(legDestination.time);
        const startDt = `${legOrigin.date}T${legOrigin.time}`;
        const endDt = `${legDestination.date}T${legDestination.time}`;
        const durationMin = calcDurationMinutes(startDt, endDt);

        if (leg.type === "WALK") {
            html += `
                <div class="timeline-step">
                    <div class="step-header">
                        <span>Promenad</span>
                        <span class="step-time">${durationMin !== null ? durationMin + ' min' : ''}</span>
                    </div>
                    <div class="step-details">
                        <div>Från ${escapeHTML(cleanName(legOrigin.name))} till ${escapeHTML(cleanName(legDestination.name))}</div>
                    </div>
                </div>
            `;
        } else {
            const metro = isMetro(leg);
            const line = lineForLeg(leg);
            const transportName = metro ? "Tunnelbana" : "Buss";
            const direction = leg.direction ? `mot ${escapeHTML(cleanName(leg.direction))}` : "";

            html += `
                <div class="timeline-step">
                    <div class="step-header">
                        <span>${transportName} ${escapeHTML(line)}</span>
                        <span class="step-time">${depTime} – ${arrTime} (${durationMin !== null ? durationMin + ' min' : ''})</span>
                    </div>
                    <div class="step-details">
                        <div><strong>Avgång:</strong> ${escapeHTML(cleanName(legOrigin.name))}</div>
                        <div><strong>Färdväg:</strong> ${transportName} linje ${escapeHTML(line)} ${direction}</div>
                        <div><strong>Ankomst:</strong> ${escapeHTML(cleanName(legDestination.name))}</div>
                    </div>
                </div>
            `;
        }

        // Check if next leg exists and calculate transfer time
        const nextLeg = legs[idx + 1];
        if (nextLeg && nextLeg.type !== "TRSF") {
            const nextOrigin = nextLeg.Origin;
            if (nextOrigin && nextOrigin.time && legDestination.time) {
                const transferMin = calcDurationMinutes(`${legDestination.date}T${legDestination.time}`, `${nextOrigin.date}T${nextOrigin.time}`);
                if (transferMin !== null && transferMin > 0) {
                    html += `
                        <div class="transfer-info-box">
                            Byte vid ${escapeHTML(cleanName(legDestination.name))} · ${transferMin} min väntetid
                        </div>
                    `;
                }
            }
        }
    });

    content.innerHTML = html;
    list.classList.add("hidden");
    detail.classList.add("visible");
    window.scrollTo({ top: 0, behavior: "smooth" });
}

document.getElementById("back").addEventListener("click", () => {
    document.getElementById("detail").classList.remove("visible");
    document.getElementById("list").classList.remove("hidden");
});

async function loadJourneys() {
    const container = document.getElementById("journeys");
    try {
        const response = await fetch(WORKER + "/resrobot/trips");
        if (!response.ok) throw new Error(`HTTP-fel: ${response.status}`);
        
        const data = await response.json();
        journeys = data.Trip || data.TripList?.Trip || [];
        if (!Array.isArray(journeys) && journeys) journeys = [journeys];

        renderJourneys();
    } catch (error) {
        console.error(error);
        container.innerHTML = `
            <div class="error">
                <strong>Kunde inte hämta resor</strong><br><br>
                ${escapeHTML(error.message)}
            </div>
        `;
    }
}

loadJourneys();
setInterval(loadJourneys, 60 * 1000);
</script>

</body>
</html>
