<!DOCTYPE html>
<html lang="sv">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
Västergöksvägen → Blackeberg
</title>


<style>

* {
    box-sizing: border-box;
}


:root {

    --background: #101318;

    --surface: #1d2228;

    --surface-hover: #272d34;

    --text: #f5f6f7;

    --secondary: #aeb4bb;

    --muted: #737981;

    --accent: #28a9ed;

    --green: #20a957;

    --divider: #30363e;
}


html,
body {

    margin: 0;

    min-height: 100%;

    background:
        var(--background);

    color:
        var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}


body {

    min-height: 100vh;

}


.app {

    width: 100%;

    max-width: 760px;

    margin: auto;

    min-height: 100vh;

    padding-bottom: 30px;

}


/* =====================================================
   HEADER
===================================================== */

.header {

    position: sticky;

    top: 0;

    z-index: 20;

    background:
        rgba(16,19,24,0.94);

    backdrop-filter:
        blur(18px);

    padding:
        25px 22px 20px;

    border-bottom:
        1px solid rgba(255,255,255,0.04);

}


.title {

    font-size: 25px;

    font-weight: 750;

    letter-spacing:
        -0.4px;

}


.subtitle {

    margin-top: 5px;

    color:
        var(--secondary);

    font-size: 14px;

}


/* =====================================================
   JOURNEY LIST
===================================================== */

.journeys {

    padding:
        12px 14px;

}


.journey {

    width: 100%;

    border: none;

    background:
        var(--surface);

    color:
        var(--text);

    border-radius:
        22px;

    padding:
        19px 18px;

    margin-bottom:
        9px;

    text-align:
        left;

    cursor:
        pointer;

    transition:
        background 0.15s,
        transform 0.1s;

}


.journey:hover {

    background:
        var(--surface-hover);

}


.journey:active {

    transform:
        scale(0.99);

}


/* =====================================================
   TIMES
===================================================== */

.times {

    display:
        grid;

    grid-template-columns:
        1fr
        28px
        1fr;

    align-items:
        center;

}


.time {

    font-size:
        28px;

    font-weight:
        750;

    line-height:
        1;

}


.time.arrival {

    text-align:
        right;

}


.arrow {

    text-align:
        center;

    color:
        var(--secondary);

    font-size:
        20px;

}


/* =====================================================
   STATIONS
===================================================== */

.stations {

    display:
        grid;

    grid-template-columns:
        1fr
        28px
        1fr;

    margin-top:
        8px;

}


.station {

    color:
        var(--secondary);

    font-size:
        14px;

}


.station.arrival {

    text-align:
        right;

}


/* =====================================================
   SUMMARY
===================================================== */

.summary {

    display:
        flex;

    align-items:
        center;

    gap:
        8px;

    margin-top:
        15px;

    color:
        var(--secondary);

    font-size:
        13px;

}


.transport {

    display:
        inline-flex;

    align-items:
        center;

    gap:
        5px;

}


.line {

    display:
        inline-flex;

    align-items:
        center;

    justify-content:
        center;

    min-width:
        26px;

    height:
        24px;

    padding:
        0 7px;

    border-radius:
        5px;

    color:
        white;

    font-weight:
        750;

    font-size:
        13px;

}


.line.bus {

    background:
        #080a0d;

}


.line.metro {

    background:
        var(--green);

}


/* =====================================================
   LOADING
===================================================== */

.loading {

    padding:
        45px 20px;

    text-align:
        center;

    color:
        var(--secondary);

}


.spinner {

    width:
        26px;

    height:
        26px;

    margin:
        0 auto 15px;

    border:
        3px solid #343a41;

    border-top-color:
        var(--accent);

    border-radius:
        50%;

    animation:
        spin 0.8s linear infinite;

}


@keyframes spin {

    to {

        transform:
            rotate(360deg);

    }

}


/* =====================================================
   ERROR
===================================================== */

.error {

    margin:
        20px 14px;

    padding:
        20px;

    border-radius:
        18px;

    background:
        #261b1d;

    color:
        #ffb8bd;

}


/* =====================================================
   DETAIL VIEW
===================================================== */

.detail {

    display:
        none;

}


.detail.visible {

    display:
        block;

}


.list.hidden {

    display:
        none;

}


.back {

    border: none;

    background: transparent;

    color:
        var(--accent);

    font-size:
        17px;

    font-weight:
        600;

    padding:
        0;

    margin-bottom:
        20px;

    cursor:
        pointer;

}


.detail-title {

    font-size:
        25px;

    font-weight:
        750;

    margin-bottom:
        25px;

}


.detail-leg {

    position:
        relative;

    display:
        grid;

    grid-template-columns:
        64px
        25px
        1fr;

    min-height:
        105px;

}


.detail-times {

    font-size:
        19px;

    font-weight:
        700;

}


.detail-line {

    position:
        relative;

    display:
        flex;

    align-items:
        center;

    flex-direction:
        column;

}


.detail-line::before {

    content:
        "";

    position:
        absolute;

    top:
        8px;

    bottom:
        8px;

    left:
        50%;

    width:
        4px;

    transform:
        translateX(-50%);

    background:
        #555c64;

    border-radius:
        5px;

}


.detail-dot {

    width:
        14px;

    height:
        14px;

    border-radius:
        50%;

    background:
        var(--background);

    border:
        4px solid white;

    z-index:
        2;

}


.detail-info {

    padding-left:
        12px;

}


.detail-stop {

    font-size:
        19px;

    font-weight:
        700;

}


.detail-vehicle {

    margin-top:
        8px;

    color:
        var(--secondary);

    font-size:
        14px;

}


.detail-transfer {

    padding:
        13px 0 18px 89px;

    color:
        var(--secondary);

    font-size:
        14px;

}


.detail-footer {

    margin-top:
        15px;

    color:
        var(--muted);

    font-size:
        12px;

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .title {

        font-size:
            22px;

    }


    .journey {

        border-radius:
            19px;

    }


    .time {

        font-size:
            25px;

    }

}

</style>

</head>


<body>


<div class="app">


    <!-- HEADER -->

    <header class="header">

        <div class="title">

            Västergöksvägen
            <span style="color:#737981">→</span>
            Blackeberg

        </div>

        <div class="subtitle">

            Nästa resor

        </div>

    </header>


    <!-- LIST -->

    <main
        id="list"
        class="list"
    >

        <div
            id="journeys"
            class="journeys"
        >

            <div class="loading">

                <div class="spinner"></div>

                Hämtar resor...

            </div>

        </div>

    </main>


    <!-- DETAIL -->

    <main
        id="detail"
        class="detail"
    >

        <div
            style="
                padding:25px 20px;
            "
        >

            <button
                id="back"
                class="back"
            >
                ← Alla resor
            </button>

            <div
                id="detailTitle"
                class="detail-title"
            ></div>

            <div
                id="detailContent"
            ></div>

            <div
                class="detail-footer"
            >
                Resan hämtas från ResRobot.
                Trafikläget kan ändras efter
                att resan planerats.
            </div>

        </div>

    </main>


</div>


<script>


const WORKER =
    "https://sl-transit-proxy.haxxerlikeshaxx.workers.dev";


let journeys = [];


/* =====================================================
   HELPERS
===================================================== */


function escapeHTML(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function timeValue(date, time) {

    if (!date || !time)
        return null;

    return new Date(
        `${date}T${time}:00`
    );

}


function durationMinutes(start, end) {

    const a =
        timeValue(
            start.date,
            start.time
        );

    const b =
        timeValue(
            end.date,
            end.time
        );

    if (!a || !b)
        return null;

    return Math.round(
        (b - a) / 60000
    );

}


/* =====================================================
   PRODUCT
===================================================== */


function productForLeg(leg) {

    const product =
        Array.isArray(leg.Product)
            ? leg.Product[0]
            : leg.Product;

    if (!product)
        return null;

    return product;
}


function lineForLeg(leg) {

    const product =
        productForLeg(leg);

    if (!product)
        return "";


    return (
        product.num ||
        product.line ||
        product.name ||
        ""
    );

}


function transportType(leg) {

    const product =
        productForLeg(leg);

    if (!product)
        return "";


    return (
        product.catOutS ||
        product.catOut ||
        product.cat ||
        product.name ||
        ""
    ).toLowerCase();

}


function isMetro(leg) {

    const text =
        transportType(leg);

    return (
        text.includes("metro") ||
        text.includes("tunnel")
    );

}


/* =====================================================
   LEG SUMMARY
===================================================== */


function journeySummary(trip) {

    const legs =
        trip.LegList?.Leg || [];

    const products = [];


    for (const leg of legs) {

        if (
            leg.type !== "JNY"
        )
            continue;


        const line =
            lineForLeg(leg);

        if (!line)
            continue;


        products.push({

            line,

            metro:
                isMetro(leg)

        });

    }


    return products;

}


/* =====================================================
   CREATE LIST ITEM
===================================================== */


function createJourneyCard(
    trip,
    index
) {

    const origin =
        trip.LegList?.Leg?.[0]
            ?.Origin;


    const legs =
        trip.LegList?.Leg || [];


    const lastLeg =
        legs[legs.length - 1];


    const destination =
        lastLeg?.Destination;


    if (
        !origin ||
        !destination
    )
        return null;


    const duration =
        durationMinutes(
            origin,
            destination
        );


    const products =
        journeySummary(trip);


    const card =
        document.createElement(
            "button"
        );

    card.className =
        "journey";


    let productHTML = "";


    for (const product of products) {

        productHTML += `
            <span class="transport">

                <span
                    class="line ${
                        product.metro
                            ? "metro"
                            : "bus"
                    }"
                >
                    ${escapeHTML(product.line)}
                </span>

            </span>
        `;

    }


    card.innerHTML = `

        <div class="times">

            <div class="time">
                ${escapeHTML(origin.time)}
            </div>

            <div class="arrow">
                →
            </div>

            <div class="time arrival">
                ${escapeHTML(
                    destination.time
                )}
            </div>

        </div>


        <div class="stations">

            <div class="station">
                ${escapeHTML(
                    origin.name
                )}
            </div>

            <div></div>

            <div class="station arrival">
                ${escapeHTML(
                    destination.name
                )}
            </div>

        </div>


        <div class="summary">

            ${productHTML}

            ${
                duration !== null
                    ? `<span>·</span>
                       <span>${duration} min</span>`
                    : ""
            }

        </div>
    `;


    card.addEventListener(
        "click",
        () => {
            showDetail(
                trip,
                index
            );
        }
    );


    return card;
}


/* =====================================================
   RENDER LIST
===================================================== */


function renderJourneys() {

    const container =
        document.getElementById(
            "journeys"
        );


    container.innerHTML = "";


    if (!journeys.length) {

        container.innerHTML = `
            <div class="error">
                Inga resor hittades.
            </div>
        `;

        return;
    }


    journeys.forEach(
        (trip, index) => {

            const card =
                createJourneyCard(
                    trip,
                    index
                );

            if (card)
                container.appendChild(
                    card
                );

        }
    );

}


/* =====================================================
   DETAIL VIEW
===================================================== */


function showDetail(
    trip,
    index
) {

    const list =
        document.getElementById(
            "list"
        );

    const detail =
        document.getElementById(
            "detail"
        );


    const title =
        document.getElementById(
            "detailTitle"
        );


    const content =
        document.getElementById(
            "detailContent"
        );


    const legs =
        trip.LegList?.Leg || [];


    const origin =
        legs[0]?.Origin;


    const destination =
        legs[legs.length - 1]
            ?.Destination;


    title.textContent =
        `${origin?.time || ""} → ${
            destination?.time || ""
        }`;


    let html = "";


    legs.forEach(
        (leg, legIndex) => {

            if (
                leg.type === "TRSF"
            ) {

                html += `
                    <div
                        class="detail-transfer"
                    >
                        ${escapeHTML(
                            leg.name ||
                            "Byte"
                        )}
                    </div>
                `;

                return;
            }


            if (
                leg.type !== "JNY" &&
                leg.type !== "WALK"
            )
                return;


            const legOrigin =
                leg.Origin;


            const legDestination =
                leg.Destination;


            if (
                !legOrigin ||
                !legDestination
            )
                return;


            const line =
                lineForLeg(leg);


            let vehicle = "";


            if (
                leg.type === "JNY"
            ) {

                const direction =
                    leg.direction || "";


                vehicle =
                    `${line ? "Linje " + escapeHTML(line) : ""}${
                        direction
                            ? " · mot " +
                              escapeHTML(direction)
                            : ""
                    }`;

            }
            else {

                vehicle =
                    "Gång";

            }


            const green =
                isMetro(leg);


            html += `

                <div
                    class="detail-leg"
                >

                    <div
                        class="detail-times"
                    >

                        <div>
                            ${escapeHTML(
                                legOrigin.time
                            )}
                        </div>

                        <div
                            style="
                                margin-top:58px;
                            "
                        >
                            ${escapeHTML(
                                legDestination.time
                            )}
                        </div>

                    </div>


                    <div
                        class="detail-line"
                        style="
                            --detail-color:
                            ${
                                green
                                    ? "#20a957"
                                    : "#59616a"
                            };
                        "
                    >

                        <div
                            class="detail-dot"
                            style="
                                border-color:
                                ${
                                    green
                                        ? "#20a957"
                                        : "white"
                                };
                            "
                        ></div>


                        <div
                            class="detail-dot"
                            style="
                                border-color:
                                ${
                                    green
                                        ? "#20a957"
                                        : "white"
                                };
                            "
                        ></div>

                    </div>


                    <div
                        class="detail-info"
                    >

                        <div
                            class="detail-stop"
                        >
                            ${escapeHTML(
                                legOrigin.name
                            )}
                        </div>


                        <div
                            class="detail-vehicle"
                        >
                            ${vehicle}
                        </div>


                        <div
                            style="
                                margin-top:55px;
                            "
                            class="detail-stop"
                        >
                            ${escapeHTML(
                                legDestination.name
                            )}
                        </div>

                    </div>

                </div>
            `;
        }
    );


    content.innerHTML =
        html;


    list.classList.add(
        "hidden"
    );

    detail.classList.add(
        "visible"
    );


    window.scrollTo(
        {
            top: 0,
            behavior: "smooth"
        }
    );

}


/* =====================================================
   BACK
===================================================== */


document
    .getElementById("back")
    .addEventListener(
        "click",
        () => {

            document
                .getElementById("detail")
                .classList.remove(
                    "visible"
                );

            document
                .getElementById("list")
                .classList.remove(
                    "hidden"
                );

        }
    );


/* =====================================================
   LOAD RESROBOT
===================================================== */


async function loadJourneys() {

    const container =
        document.getElementById(
            "journeys"
        );


    try {

        const response =
            await fetch(
                WORKER +
                "/resrobot/trips"
            );


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const data =
            await response.json();


        journeys =
            data.TripList?.Trip ||
            [];


        /*
         * If ResRobot returns only one
         * object instead of an array.
         */

        if (
            !Array.isArray(journeys) &&
            journeys
        ) {

            journeys = [
                journeys
            ];

        }


        renderJourneys();


    } catch (error) {

        console.error(
            error
        );


        container.innerHTML = `

            <div class="error">

                <strong>
                    Kunde inte hämta resor
                </strong>

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

    }

}


loadJourneys();


/*
 * Refresh the home screen every minute.
 *
 * ResRobot's route planner is intended
 * for this type of route-planning use.
 */

setInterval(
    loadJourneys,
    60 * 1000
);

</script>

</body>
</html>
