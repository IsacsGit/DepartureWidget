<!DOCTYPE html>
<html lang="sv">

<head>

<meta charset="UTF-8">

<meta
    name="js-widget-title"
    content="Blackeberg"
>

<style>

/* =========================================================
   BAS
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;
}

body {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        sans-serif;

    background: #111214;

    color: white;

    padding: 15px;
}


/* =========================================================
   RUBRIK
   ========================================================= */

.title {

    font-size: 16px;

    font-weight: 700;

    margin-bottom: 8px;
}


/* =========================================================
   AVGÅNGSLISTA
   ========================================================= */

.departures {

    width: 100%;
}


/* =========================================================
   AVGÅNGSRAD
   ========================================================= */

.departure {

    display: flex;

    align-items: center;

    height: 36px;

    border-bottom:
        1px solid
        rgba(255,255,255,0.08);
}

.departure:last-child {

    border-bottom: none;
}


/* =========================================================
   LINJENUMMER
   ========================================================= */

.line {

    width: 31px;

    height: 24px;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #45a65a;

    border-radius: 7px;

    font-size: 13px;

    font-weight: 700;

    flex-shrink: 0;
}


/* =========================================================
   DESTINATION

   FAST BREDD!

   Alla tider börjar därför på exakt
   samma position.
   ========================================================= */

.destination {

    margin-left: 8px;

    width: 105px;

    flex: 0 0 105px;

    font-size: 12px;

    color: #eeeeee;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =========================================================
   TID
   ========================================================= */

.time {

    margin-left: 8px;

    font-size: 13px;

    font-weight: 700;

    white-space: nowrap;

    flex: 0 0 auto;
}


/* =========================================================
   "NU"
   ========================================================= */

.now {

    color: #55d66f;
}


/* =========================================================
   FELTEXT
   ========================================================= */

.error {

    color: #9b9ba1;

    font-size: 12px;

    margin-top: 5px;
}

</style>

</head>


<body>


<!-- =======================================================
     RUBRIK
     ======================================================= -->

<div class="title">
    Blackeberg
</div>


<!-- =======================================================
     AVGÅNGAR
     ======================================================= -->

<div
    id="departures"
    class="departures"
>
    Hämtar…
</div>


<script>


/* =========================================================
   SL TRANSPORT API

   Blackeberg = site 9105
   ========================================================= */

const API =
    "https://transport.integration.sl.se/v1/sites/9105/departures";


/* =========================================================
   WIDGETWEB

   WidgetWeb väntar på denna funktion innan
   den tar sin bild av sidan.

   Vi ger API-anropet lite tid att bli klart.
   ========================================================= */

function __wweb2WaitMillisecondsToWidgetIsReady(
    currentDelayMs
) {

    return 2000;
}


/* =========================================================
   FORMATERA AVGÅNGSTID

   Exempel:

   0 min  -> Nu
   1 min  -> 1 min
   3 min  -> 3 min
   12 min -> 12 min
   ========================================================= */

function formatTime(
    departureTime
) {

    if (!departureTime) {

        return "?";
    }


    const departure =
        new Date(
            departureTime
        );


    const now =
        new Date();


    const differenceMs =
        departure.getTime() -
        now.getTime();


    const differenceMinutes =
        Math.ceil(
            differenceMs / 60000
        );


    if (
        differenceMinutes <= 0
    ) {

        return "Nu";
    }


    return (
        differenceMinutes +
        " min"
    );
}


/* =========================================================
   KONTROLLERA DESTINATION

   Vi accepterar ENDAST:

   - Hässelby strand
   - Vällingby

   Vällingby är INTE obligatoriskt.

   Om fyra Hässelby strand kommer först
   visas fyra Hässelby strand.
   ========================================================= */

function isCorrectDestination(
    destination
) {

    if (
        typeof destination !==
        "string"
    ) {

        return false;
    }


    const text =
        destination
            .toLowerCase()
            .trim();


    return (
        text === "hässelby strand" ||
        text === "hasselby strand" ||
        text === "vällingby" ||
        text === "vallingby"
    );
}


/* =========================================================
   KONTROLLERA TUNNELBANA

   Vi kontrollerar transport_mode.

   Detta är viktigt eftersom vi inte bara
   ska anta att linje 17/18/19 = tunnelbana.
   ========================================================= */

function isMetro(
    departure
) {

    const mode =
        String(
            departure
                ?.line
                ?.transport_mode ??
            ""
        )
        .toUpperCase()
        .trim();


    return mode === "METRO";
}


/* =========================================================
   KONTROLLERA LINJE

   Endast:

   17
   18
   19
   ========================================================= */

function isCorrectLine(
    departure
) {

    const line =
        String(
            departure
                ?.line
                ?.designation ??
            ""
        )
        .trim();


    return (
        line === "17" ||
        line === "18" ||
        line === "19"
    );
}


/* =========================================================
   HÄMTA AVGÅNGAR
   ========================================================= */

async function loadDepartures() {


    const container =
        document.getElementById(
            "departures"
        );


    try {


        /* =================================================
           CACHE-BUSTING

           Timestamp gör URL:en unik vid varje
           hämtning.

           Exempel:

           .../departures?cache=175...
           ================================================= */

        const url =
            API +
            "?cache=" +
            Date.now();


        /* =================================================
           HÄMTA FÄRSK DATA
           ================================================= */

        const response =
            await fetch(
                url,
                {
                    cache: "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "SL API " +
                response.status
            );
        }


        const data =
            await response.json();


        /* =================================================
           SL API RETURNERAR:

           {
               departures: [...]
           }

           Vi använder exakt den listan.
           ================================================= */

        if (
            !Array.isArray(
                data.departures
            )
        ) {

            throw new Error(
                "SL API saknar departures"
            );
        }


        let departures =
            data.departures;


        /* =================================================
           STEG 1

           ENDAST TUNNELBANA
           ================================================= */

        departures =
            departures.filter(
                function(departure) {

                    return isMetro(
                        departure
                    );

                }
            );


        /* =================================================
           STEG 2

           ENDAST 17, 18, 19
           ================================================= */

        departures =
            departures.filter(
                function(departure) {

                    return isCorrectLine(
                        departure
                    );

                }
            );


        /* =================================================
           STEG 3

           ENDAST HÄSSELBY STRAND /
           VÄLLINGBY

           Vällingby är INTE obligatoriskt.
           ================================================= */

        departures =
            departures.filter(
                function(departure) {

                    return isCorrectDestination(
                        departure.destination
                    );

                }
            );


        /* =================================================
           STEG 4

           VÄLJ TID

           expected = realtid
           scheduled = tidtabell

           Vi använder expected om den finns.
           ================================================= */

        departures =
            departures
                .map(
                    function(departure) {


                        const time =
                            departure.expected ??
                            departure.scheduled;


                        return {

                            departure:
                                departure,

                            time:
                                time

                        };

                    }
                );


        /* =================================================
           TA BORT AVGÅNGAR UTAN GILTIG TID
           ================================================= */

        departures =
            departures.filter(
                function(item) {


                    if (
                        !item.time
                    ) {

                        return false;
                    }


                    const timestamp =
                        new Date(
                            item.time
                        ).getTime();


                    return (
                        !isNaN(
                            timestamp
                        )
                    );

                }
            );


        /* =================================================
           STEG 5

           SORTERA ALLA MATCHANDE AVGÅNGAR

           Det här är det viktiga.

           Vi blandar:

           17 Hässelby
           18 Hässelby
           19 Vällingby
           17 Vällingby

           och sorterar ALLA efter faktisk avgångstid.

           Ingen destination prioriteras.
           ================================================= */

        departures.sort(
            function(a, b) {

                return (
                    new Date(
                        a.time
                    ).getTime()

                    -

                    new Date(
                        b.time
                    ).getTime()
                );

            }
        );


        /* =================================================
           STEG 6

           NU tar vi exakt fyra.

           INTE före sorteringen.

           INTE en av varje linje.

           INTE en Vällingby.

           Bara de fyra närmaste.
           ================================================= */

        departures =
            departures.slice(
                0,
                4
            );


        /* =================================================
           OM VI INTE HAR NÅGRA AVGÅNGAR
           ================================================= */

        if (
            departures.length === 0
        ) {

            container.innerHTML =
                '<div class="error">' +
                'Inga avgångar hittades' +
                '</div>';

            return;
        }


        /* =================================================
           RENSA
           ================================================= */

        container.innerHTML =
            "";


        /* =================================================
           VISA DE FYRA AVGÅNGARNA
           ================================================= */

        departures.forEach(
            function(item) {


                const departure =
                    item.departure;


                /* Linje */

                const line =
                    String(
                        departure
                            ?.line
                            ?.designation ??
                        "?"
                    );


                /* Destination */

                const destination =
                    String(
                        departure
                            ?.destination ??
                        ""
                    );


                /* Tid */

                const formattedTime =
                    formatTime(
                        item.time
                    );


                /* Skapa rad */

                const row =
                    document.createElement(
                        "div"
                    );


                row.className =
                    "departure";


                /* =================================================
                   HTML FÖR RADEN
                   ================================================= */

                row.innerHTML = `

                    <div class="line">
                        ${line}
                    </div>

                    <div class="destination">
                        ${destination}
                    </div>

                    <div
                        class="time ${
                            formattedTime === "Nu"
                                ? "now"
                                : ""
                        }"
                    >
                        ${formattedTime}
                    </div>

                `;


                container.appendChild(
                    row
                );

            }
        );


    }


    catch (
        error
    ) {


        console.error(
            error
        );


        container.innerHTML =
            '<div class="error">' +
            'Kunde inte hämta avgångar' +
            '</div>';


        /*
         * WidgetWeb Developer Mode
         */

        if (
            typeof __wweb2Log ===
            "function"
        ) {

            __wweb2Log(
                "SL error: " +
                error.message
            );

        }

    }

}


/* =========================================================
   STARTA
   ========================================================= */

loadDepartures();

</script>


</body>

</html>
