/* ============================================================
   API-NYCKLAR
   ============================================================ */

/*
 * ResRobot v2.1
 */
const RESROBOT_KEY =
    "PASTE_YOUR_RESROBOT_KEY_HERE";


/*
 * Trafiklab GTFS Regional Realtime.
 *
 * Nyckeln du gav:
 *
 * e56430164e3b4fc8a4b3461ac1e52d8f
 */
const TRAFIKLAB_KEY =
    "e56430164e3b4fc8a4b3461ac1e52d8f";


/* ============================================================
   FASTA SL-ID
   ============================================================ */

const STOPS = {
    origin: {
        id: "3870",
        name: "Västergöksvägen"
    },

    transfer: {

    },

/*
 * GTFS Regional operator.
 */

/* ============================================================
   HJÄLP
   ============================================================ */

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function normalize(value) {
    return String(value ?? "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/\s+/g, " ")
        .trim();
}


function getProduct(leg) {

    if (!leg) {
        return null;
    }

    if (Array.isArray(leg.Product)) {
        return leg.Product[0] || null;
    }

    return leg.Product || null;
}


function getLine(leg) {

    const product =
        getProduct(leg);

    return String(
        product?.num ??
        leg?.number ??
        ""
    ).trim();
}


function isJourney(leg) {
    return leg?.type === "JNY";
}


function getLegs(trip) {

    const legs =
        trip?.LegList?.Leg;

    return Array.isArray(legs)
        ? legs
        : [];
}


function minutesFromNow(timestamp) {

    if (!timestamp) {
        return null;
    }

    const time =
        new Date(timestamp).getTime();

    if (!Number.isFinite(time)) {
        return null;
    }

    return Math.round(
        (time - Date.now()) / 60000
    );
}


function formatMinutes(timestamp) {

    const minutes =
        minutesFromNow(timestamp);

    if (minutes === null) {
        return "";
    }

    if (minutes <= 0) {
        return `<span class="now">Nu</span>`;
    }

    return `${minutes} min`;
}


async function fetchJson(url, label) {

    const response =
        await fetch(
            url,
            {
                cache: "no-store"
            }
        );

    if (!response.ok) {
        throw new Error(
            `${label}: HTTP ${response.status}`
        );
    }

    return response.json();
}


/* ============================================================
   RESROBOT
   ============================================================ */

function resrobotDateTime() {

    const now =
        new Date();

    const date =
        `${now.getFullYear()}-` +
        `${String(
            now.getMonth() + 1
        ).padStart(2, "0")}-` +
        `${String(
            now.getDate()
        ).padStart(2, "0")}`;

    const time =
        `${String(
            now.getHours()
        ).padStart(2, "0")}:` +
        `${String(
            now.getMinutes()
        ).padStart(2, "0")}`;

    return {
        date,
        time
    };
}


async function getResRobotTrip() {

    /*
     * Västergöksvägen:
     * 7449901 är det verifierade ResRobot-id:t.
     *
     * Blackeberg använder vi inte som ResRobot-id här.
     *
     * I stället planerar vi till Blackebergs
     * koordinat/SL-hållplats via ResRobot lookup.
     */

    const lookupParams =
        new URLSearchParams({
            input: "Blackeberg",
            maxNo: "10",
            format: "json",
            lang: "sv",
            accessId: RESROBOT_KEY
        });

    const lookup =
        await fetchJson(
            `${RESROBOT_BASE}/location.name?${lookupParams}`,
            "ResRobot Blackeberg"
        );

    const locations =
        lookup?.StopLocation;

    if (
        !Array.isArray(locations) ||
        locations.length === 0
    ) {
        throw new Error(
            "ResRobot hittade inte Blackeberg."
        );
    }

    const exact =
        locations.find(
            x =>
                normalize(x.name) ===
                normalize("Blackeberg")
        );

    const destination =
        exact || locations[0];

    if (!destination?.extId) {
        throw new Error(
            "Blackeberg saknar ResRobot-id."
        );
    }

    const {
        date,
        time
    } =
        resrobotDateTime();

    const params =
        new URLSearchParams({
            format: "json",

            originId: "7449901",

            destId:
                destination.extId,

            date,
            time,

            numF: "5",

            passlist: "1",

            showPassingPoints: "true",

            accessId:
                RESROBOT_KEY
        });

    const data =
        await fetchJson(
            `${RESROBOT_BASE}/trip?${params}`,
            "ResRobot reseplanering"
        );

    const trips =
        data?.Trip;

    if (
        !Array.isArray(trips) ||
        trips.length === 0
    ) {
        throw new Error(
            "ResRobot hittade ingen resa."
        );
    }

    return trips;
}


/* ============================================================
   SL AVGÅNGAR
   ============================================================ */

async function getDepartures(siteId) {

    return fetchJson(
        `${SL_BASE}/sites/${siteId}/departures`,
        `SL avgångar ${siteId}`
    );
}


function getDepartureLine(dep) {

    return String(
        dep?.line?.designation ??
        ""
    ).trim();
}


function getDepartureDestination(dep) {

    return String(
        dep?.destination ??
        ""
    ).trim();
}


function getDepartureExpected(dep) {

    return (
        dep?.expected ??
        dep?.scheduled ??
        null
    );
}


function findLineDeparture(
    departures,
    line
) {

    const wanted =
        String(line).trim();

    const candidates =
        departures.filter(
            dep =>
                getDepartureLine(dep) ===
                wanted
        );

    if (
        candidates.length === 0
    ) {
        return null;
    }

    const future =
        candidates.filter(
            dep => {

                const value =
                    getDepartureExpected(dep);

                return (
                    value &&
                    minutesFromNow(value) >= -1
                );
            }
        );

    return (
        future[0] ||
        candidates[0]
    );
}

   KARTA

L.tileLayer(

let routeLayer = null;

const stopMarkers = new Map();

const vehicleMarkers = new Map();


/*
 * Fallback-koordinater.
 *
 * Dessa ersätts med SL:s aktuella site-data
 * så fort den laddas.
 */
const stopCoordinates = {
    "3870": null,
    "9103": null,
    "9105": null
};


async function loadSLStopData() {

    const data =
        await fetchJson(
            `${SL_BASE}/sites?expand=true`,
            "SL hållplatser"
        );

    const sites =
        Array.isArray(data)
            ? data
            : [];

    for (const site of sites) {

        const id =
            String(
                site?.id ??
                site?.siteId ??
                ""
            );

        if (
            !Object.prototype.hasOwnProperty.call(
                stopCoordinates,
                id
            )
        ) {
            continue;
        }

        const lat =
            Number(
                site?.lat ??
                site?.latitude
            );

        const lon =
            Number(
                site?.lon ??
                site?.longitude
            );

        if (
            Number.isFinite(lat) &&
            Number.isFinite(lon)
        ) {
            stopCoordinates[id] = {
                lat,
                lon,
                name:
                    site?.name ||
                    ""
            };
        }
    }

    /*
     * Västergöksvägen 3870 kan i vissa SL-data
     * vara en äldre site-referens. Om den inte
     * finns används ResRobot-data nedan.
     */
}


/* ============================================================
   STOPP-MARKÖRER
   ============================================================ */

function stopIcon() {

    return L.divIcon({
        className: "",
        html:
            `<div class="stop-marker"></div>`,
        iconSize: [12, 12],
        iconAnchor: [6, 6]
    });
}


function drawStopMarkers() {

    for (
        const [
            id,
            marker
        ] of stopMarkers
    ) {
        map.removeLayer(marker);
    }

    stopMarkers.clear();

    const points = [];

    for (
        const [
            id,
            data
        ] of Object.entries(
            stopCoordinates
        )
    ) {

        if (!data) {
            continue;
        }

        const marker =
            L.marker(
                [
                    data.lat,
                    data.lon
                ],
                {
                    icon:
                        stopIcon()
                }
            )
            .addTo(map)
            .bindTooltip(
                data.name ||
                (
                    id === "3870"
                        ? "Västergöksvägen"
                        : id === "9103"
                            ? "Vällingby"
                            : "Blackeberg"
                )
            );

        stopMarkers.set(
            id,
            marker
        );

        points.push([
            data.lat,
            data.lon
        ]);
    }

    if (
        points.length >= 2
    ) {

        routeLayer =
            L.polyline(
                points,
                {
                    weight: 5,
                    opacity: .85
                }
            ).addTo(map);

        map.fitBounds(
            routeLayer.getBounds(),
            {
                padding: [18, 18]
            }
        );
    }
}


/* ============================================================
   GTFS-RT PROTOBUF
   ============================================================ */

let GtfsRealtimeBindings = null;


async function loadGTFSRealtimeLibrary() {

    /*
     * Version 1.x används här eftersom den är
     * den browser-vänliga generationen av bindings.
     *
     * Trafiklab/GTFS använder protobuf för GTFS-RT.
     */
    const module =
        await import(
            "https://cdn.jsdelivr.net/npm/gtfs-realtime-bindings@1.1.1/+esm"
        );

    GtfsRealtimeBindings =
        module.default ||
        module;
}


async function fetchRealtimeFeed(
    feedName
) {

    const url =
        `${GTFS_RT_BASE}/${feedName}.pb?key=${
            encodeURIComponent(
                TRAFIKLAB_KEY
            )
        }`;

    const response =
        await fetch(
            url,
            {
                cache: "no-store"
            }
        );

    if (!response.ok) {
        throw new Error(
            `GTFS-RT ${feedName}: HTTP ${response.status}`
        );
    }

    const buffer =
        await response.arrayBuffer();

    const bytes =
        new Uint8Array(buffer);

    const FeedMessage =
        GtfsRealtimeBindings
            .transit_realtime
            .FeedMessage;

    return FeedMessage.decode(bytes);
}


/* ============================================================
   GTFS-RT VEHICLE POSITIONS
   ============================================================ */

function extractVehiclePositions(
    feed
) {

    const result = [];

    for (
        const entity of feed.entity || []
    ) {

        const vehicle =
            entity.vehicle;

        if (!vehicle) {
            continue;
        }

        const position =
            vehicle.position;

        if (!position) {
            continue;
        }

        const latitude =
            Number(
                position.latitude
            );

        const longitude =
            Number(
                position.longitude
            );

        if (
            !Number.isFinite(latitude) ||
            !Number.isFinite(longitude)
        ) {
            continue;
        }

        const trip =
            vehicle.trip || {};

        const vehicleInfo =
            vehicle.vehicle || {};

        result.push({
            id:
                entity.id ||
                vehicleInfo.id ||
                `${latitude},${longitude}`,

            routeId:
                String(
                    trip.routeId ||
                    ""
                ),

            tripId:
                String(
                    trip.tripId ||
                    ""
                ),

            latitude,
            longitude,

            bearing:
                Number(
                    position.bearing
                ),

            speed:
                Number(
                    position.speed
                ),

            label:
                String(
                    vehicleInfo.label ||
                    vehicleInfo.name ||
                    ""
                ),

            stopId:
                String(
                    vehicle.stopId ||
                    ""
                )
        });
    }

    return result;
}


/* ============================================================
   GTFS STATIC
   ============================================================ */

let staticData = null;


/*
 * Enkel CSV-parser som klarar:
 * - komma
 * - citationstecken
 * - escaped citationstecken
 */
function parseCSV(text) {

    const rows = [];

    let row = [];
    let cell = "";
    let quoted = false;

    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const char =
            text[i];

        if (char === '"') {

            if (
                quoted &&
                text[i + 1] === '"'
            ) {
                cell += '"';
                i++;
            } else {
                quoted = !quoted;
            }

            continue;
        }

        if (
            char === "," &&
            !quoted
        ) {
            row.push(cell);
            cell = "";
            continue;
        }

        if (
            (char === "\n" ||
             char === "\r") &&
            !quoted
        ) {

            if (
                char === "\r" &&
                text[i + 1] === "\n"
            ) {
                i++;
            }

            row.push(cell);
            rows.push(row);

            row = [];
            cell = "";

            continue;
        }

        cell += char;
    }

    if (
        cell.length > 0 ||
        row.length > 0
    ) {
        row.push(cell);
        rows.push(row);
    }

    if (
        rows.length === 0
    ) {
        return [];
    }

    const headers =
        rows[0];

    return rows
        .slice(1)
        .filter(
            row =>
                row.length &&
                row.some(
                    value =>
                        value !== ""
                )
        )
        .map(row => {

            const object = {};

            headers.forEach(
                (
                    header,
                    index
                ) => {
                    object[header] =
                        row[index] ??
                        "";
                }
            );

            return object;
        });
}


async function loadStaticGTFS() {

    /*
     * Static GTFS är en zip-fil.
     */
    const response =
        await fetch(
            GTFS_STATIC_URL,
            {
                cache: "no-store"
            }
        );

    if (!response.ok) {
        throw new Error(
            `GTFS static: HTTP ${response.status}`
        );
    }

    const buffer =
        await response.arrayBuffer();

    const JSZip =
        (
            await import(
                "https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm"
            )
        ).default;

    const zip =
        await JSZip.loadAsync(
            buffer
        );

    async function read(
        filename
    ) {

        const file =
            zip.file(filename);

        if (!file) {
            return [];
        }

        const text =
            await file.async(
                "string"
            );

        return parseCSV(text);
    }

    const [
        routes,
        trips,
        shapes
    ] =
        await Promise.all([
            read("routes.txt"),
            read("trips.txt"),
            read("shapes.txt")
        ]);

    staticData = {
        routes,
        trips,
        shapes
    };

    return staticData;
}


/* ============================================================
   GTFS STATIC → LINJE / SHAPE
   ============================================================ */

function getRouteFromTrip(
    tripId
) {

    if (!staticData) {
        return null;
    }

    const trip =
        staticData.trips.find(
            x =>
                String(
                    x.trip_id
                ) ===
                String(tripId)
        );

    if (!trip) {
        return null;
    }

    const route =
        staticData.routes.find(
            x =>
                String(
                    x.route_id
                ) ===
                String(
                    trip.route_id
                )
        );

    return {
        trip,
        route
    };
}


function getShape(
    shapeId
) {

    if (!staticData) {
        return [];
    }

    return staticData.shapes
        .filter(
            point =>
                String(
                    point.shape_id
                ) ===
                String(shapeId)
        )
        .sort(
            (
                a,
                b
            ) =>
                Number(
                    a.shape_pt_sequence
                ) -
                Number(
                    b.shape_pt_sequence
                )
        )
        .map(
            point => [
                Number(
                    point.shape_pt_lat
                ),
                Number(
                    point.shape_pt_lon
                )
            ]
        )
        .filter(
            point =>
                Number.isFinite(
                    point[0]
                ) &&
                Number.isFinite(
                    point[1]
                )
        );
}

   VEHICLE MARKERS

}


function updateVehicleMarkers(
    vehicles,
    relevantRouteIds
) {

    const wanted =
        new Set(
            relevantRouteIds
                .filter(Boolean)
                .map(
                    String
                )
        );

    const visible =
        vehicles.filter(
            vehicle =>
                wanted.size === 0 ||
                wanted.has(
                    vehicle.routeId
                )
        );

    const seen =
        new Set();

    for (
        const vehicle of visible
    ) {

        seen.add(
            vehicle.id
        );

        const staticInfo =
            getRouteFromTrip(
                vehicle.tripId
            );

        const route =
            staticInfo?.route;

        const isMetro =
            Number(
                route?.route_type
            ) >= 400 &&
            Number(
                route?.route_type
            ) <= 499;

        const label =
            route?.route_short_name ||
            vehicle.label ||
            "";

        const latlng = [
            vehicle.latitude,
            vehicle.longitude
        ];

        if (
            vehicleMarkers.has(
                vehicle.id
            )
        ) {

            const marker =
                vehicleMarkers.get(
                    vehicle.id
                );

            marker.setLatLng(
                latlng
            );

            marker.setIcon(
                vehicleIcon(
                    label,
                    isMetro
                )
            );

        } else {

            const marker =
                L.marker(
                    latlng,
                    {
                        icon:
                            vehicleIcon(
                                label,
                                isMetro
                            )
                    }
                )
                .addTo(map);

            marker.bindTooltip(
                label
                    ? `${label}${
                        vehicle.label
                            ? ` · ${vehicle.label}`
                            : ""
                    }`
                    : "SL-fordon"
            );

            vehicleMarkers.set(
                vehicle.id,
                marker
            );
        }
    }


    /*
     * Ta bort fordon som inte längre finns
     * i senaste feeden.
     */
    for (
        const [
            id,
            marker
        ] of vehicleMarkers
    ) {

        if (!seen.has(id)) {

            map.removeLayer(
                marker
            );

            vehicleMarkers.delete(
                id
            );
        }
    }


    mapStatus.textContent =
        `${visible.length} fordon i realtid`;
}


/* ============================================================
   FÖRSÖK IDENTIFIERA LINJER
   ============================================================ */

function getJourneyLines(
    trips
) {

    const lines = [];

    for (
        const trip of trips
    ) {

        for (
            const leg of getLegs(trip)
        ) {

            if (!isJourney(leg)) {
                continue;
            }

            const line =
                getLine(leg);

            if (
                line &&
                !lines.includes(line)
            ) {
                lines.push(line);
            }
        }
    }

    return lines;
}


function staticRouteIdsForLines(
    lines
) {

    if (!staticData) {
        return [];
    }

    return staticData.routes
        .filter(
            route =>
                lines.includes(
                    String(
                        route.route_short_name
                    )
                )
        )
        .map(
            route =>
                String(
                    route.route_id
                )
        );
}


/* ============================================================
   RITA SHAPE FÖR RELEVANTA TRIPPAR
   ============================================================ */

function drawActualShapes(
    realtimeVehicles,
    lines
) {

    if (!staticData) {
        return;
    }

    const relevantTripIds =
        realtimeVehicles
            .filter(
                vehicle => {

                    const info =
                        getRouteFromTrip(
                            vehicle.tripId
                        );

                    return (
                        info?.route &&
                        lines.includes(
                            String(
                                info.route
                                    .route_short_name
                            )
                        );
                    };
                }
            )
            .map(
                vehicle =>
                    vehicle.tripId
            );

    /*
     * Ta bort gamla shape-lager.
     */
    if (
        window.__shapeLayers
    ) {

        for (
            const layer of
            window.__shapeLayers
        ) {
            map.removeLayer(
                layer
            );
        }
    }

    window.__shapeLayers = [];

    /*
     * Rita max ett begränsat antal shapes
     * så kartan inte blir överfull.
     */
    const uniqueTrips =
        [...new Set(
            relevantTripIds
        )].slice(0, 8);

    for (
        const tripId of uniqueTrips
    ) {

        const info =
            getRouteFromTrip(
                tripId
            );

        if (!info?.trip) {
            continue;
        }

        const points =
            getShape(
                info.trip.shape_id
            );

        if (
            points.length < 2
        ) {
            continue;
        }

        const layer =
            L.polyline(
                points,
                {
                    weight: 3,
                    opacity: .55
                }
            ).addTo(map);

        window.__shapeLayers.push(
            layer
        );
    }
}


/* ============================================================
   VISA RESVÄGEN
   ============================================================ */

function renderTrip(
    trip,
    departures
) {

    const legs =
        getLegs(trip);

    let html = "";

    const journeyLegs =
        legs.filter(
            isJourney
        );

    if (
        journeyLegs.length === 0
    ) {
        throw new Error(
            "Resan saknar kollektivtrafik."
        );
    }


    for (
        let i = 0;
        i < journeyLegs.length;
        i++
    ) {

        const leg =
            journeyLegs[i];

        const line =
            getLine(leg);

        const origin =
            String(
                leg?.Origin?.name ||
                ""
            );

        const destination =
            String(
                leg?.Destination?.name ||
                leg?.direction ||
                ""
            );


        /*
         * Använd SL-realtid när det går.
         */
        const matchingDeparture =
            departures.find(
                item =>
                    item.line === line &&
                    normalize(
                        item.origin
                    ) ===
                    normalize(origin)
            );


        let timeHtml = "";

        if (
            matchingDeparture
        ) {

            timeHtml =
                formatMinutes(
                    matchingDeparture.expected
                );

        } else {

            const date =
                leg?.Origin?.date;

            const time =
                leg?.Origin?.time;

            if (
                date &&
                time
            ) {

                const timestamp =
                    new Date(
                        `${date}T${time}:00`
                    ).toISOString();

                timeHtml =
                    formatMinutes(
                        timestamp
                    );
            }
        }


        html += `
            <div class="trip-row">

                <div class="line">
                    ${escapeHtml(line)}
                </div>

                <div class="destination">
                    ${escapeHtml(
                        destination
                    )}
                </div>

                <div class="time">
                    ${timeHtml}
                </div>

            </div>
        `;


        /*
         * Byte mellan kollektivtrafikben.
         */
        if (
            i <
            journeyLegs.length - 1
        ) {

            const next =
                journeyLegs[i + 1];

            const transfer =
                next?.Origin?.name ||
                leg?.Destination?.name ||
                "";

            html += `
                <div class="transfer">
                    Byte vid
                    ${escapeHtml(
                        transfer
                    )}
                    <span class="arrow">
                        →
                    </span>
                    ${escapeHtml(
                        getLine(next)
                    )}
                </div>
            `;
        }
    }


    contentRows.innerHTML =
        html;


    routeSummary.textContent =
        journeyLegs
            .map(
                leg =>
                    `${getLine(leg)} ${
                        leg?.Destination?.name || ""
                    }`
            )
            .join(" → ");
}


/* ============================================================
   HÄMTA SL-AVGÅNGAR FÖR HELA RUTTEN
   ============================================================ */

async function loadRelevantDepartures(
    trip
) {

    const legs =
        getLegs(trip)
            .filter(
                isJourney
            );

    const result = [];

    /*
     * Västergöksvägen → första bussen
     */
    const originData =
        await getDepartures(
            STOPS.origin.id
        );


    /*
     * Vällingby → tunnelbana
     */
    const transferData =
        await getDepartures(
            STOPS.transfer.id
        );


    for (
        const leg of legs
    ) {

        const line =
            getLine(leg);

        const origin =
            String(
                leg?.Origin?.name ||
                ""
            );

        const source =
            normalize(origin)
                .includes(
                    normalize(
                        STOPS.transfer.name
                    )
                )
                ? transferData
                : originData;


        const dep =
            findLineDeparture(
                source?.departures || [],
                line
            );

        if (!dep) {
            continue;
        }

        result.push({
            line,

            origin,

            destination:
                getDepartureDestination(
                    dep
                ),

            expected:
                getDepartureExpected(
                    dep
                )
        });
    }

    return result;
}


/* ============================================================
   REALTIME LOOP
   ============================================================ */

let currentLines = [];

let currentRouteIds = [];

let latestVehicles = [];


async function updateRealtime() {

    try {

        /*
         * VehiclePositions.
         */
        const vehicleFeed =
            await fetchRealtimeFeed(
                "VehiclePositions"
            );

        latestVehicles =
            extractVehiclePositions(
                vehicleFeed
            );


        /*
         * Visa relevanta fordon.
         */
        updateVehicleMarkers(
            latestVehicles,
            currentRouteIds
        );


        /*
         * Om static-data finns kan vi rita
         * den faktiska GTFS-shapen.
         */
        drawActualShapes(
            latestVehicles,
            currentLines
        );

    } catch (error) {

        console.error(
            "GTFS-RT:",
            error
        );

        mapStatus.textContent =
            "GPS-data kunde inte hämtas";
    }
}


/* ============================================================
   HUVUDPROGRAM
   ============================================================ */

async function main() {

    if (
        !RESROBOT_KEY ||
        RESROBOT_KEY ===
            "PASTE_YOUR_RESROBOT_KEY_HERE"
    ) {

        throw new Error(
            "Fyll i ResRobot API-nyckeln längst upp."
        );
    }


    /*
     * 1. Ladda SL Site-data.
     */
    await loadSLStopData();

    drawStopMarkers();


    /*
     * 2. Ladda GTFS-RT decoder.
     */
    await loadGTFSRealtimeLibrary();


    /*
     * 3. Försök ladda GTFS static.
     *
     * Detta behövs för:
     * route_id → linjenummer
     * trip_id → shape
     *
     * Om nyckeln saknar static-behörighet
     * fortsätter widgeten ändå.
     */
    try {

        await loadStaticGTFS();

    } catch (error) {

        console.warn(
            "GTFS static kunde inte laddas:",
            error
        );

        staticData = null;
    }


    /*
     * 4. Hämta resealternativ.
     */
    const trips =
        await getResRobotTrip();


    /*
     * Välj första användbara resan.
     */
    const trip =
        trips.find(
            candidate =>
                getLegs(candidate)
                    .some(isJourney)
        );

    if (!trip) {
        throw new Error(
            "Ingen användbar resa hittades."
        );
    }


    /*
     * 5. Hämta aktuella SL-avgångar.
     */
    let departures = [];

    try {

        departures =
            await loadRelevantDepartures(
                trip
            );

    } catch (error) {

        console.warn(
            "SL realtid:",
            error
        );
    }


    /*
     * 6. Visa rutten.
     */
    renderTrip(
        trip,
        departures
    );


    /*
     * 7. Identifiera relevanta linjer.
     */
    currentLines =
        getJourneyLines(
            [trip]
        );


    /*
     * 8. Matcha route_id från GTFS static.
     */
    currentRouteIds =
        staticRouteIdsForLines(
            currentLines
        );


    /*
     * 9. Hämta GPS-positioner.
     */
    await updateRealtime();


    /*
     * 10. Uppdatera GPS ungefär var 5:e sekund.
     */
    setInterval(
        updateRealtime,
        5000
    );


    /*
     * 11. Uppdatera avgångarna varje 15:e sekund.
     */
    setInterval(
        async () => {

            try {

                const fresh =
                    await loadRelevantDepartures(
                        trip
                    );

                renderTrip(
                    trip,
                    fresh
                );

            } catch (error) {

                console.warn(
                    "Avgångsuppdatering:",
                    error
                );
            }

        },
        15000
    );
}


/* ============================================================
   START
   ============================================================ */

main()
    .catch(
        error => {

            console.error(
                "Widget:",
                error
            );

            contentRows.innerHTML = `
                <div class="error">
                    ${escapeHtml(
                        error?.message ||
                        "Okänt fel"
                    )}
                </div>
            `;

            routeSummary.textContent =
                "Kunde inte bygga resvägen.";

            mapStatus.textContent =
                "Ingen realtidsdata";
        }
    );


/*
 * WidgetWeb.
 */
window.addEventListener(
    "load",
    () => {

        if (
            typeof window.WidgetWeb !==
            "undefined" &&
            typeof window.WidgetWeb.ready ===
            "function"
        ) {
            window.WidgetWeb.ready();
        }
    }
);

</script>
