<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="js-widget-title" content="Blackeberg">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                 "Helvetica Neue", sans-serif;
    background: #111214;
    color: white;
    padding: 15px;
}

/* =========================
   RUBRIK
   ========================= */

.title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 8px;
}


/* =========================
   AVGÅNGSLISTA
   ========================= */

.departures {
    width: 100%;
}


/* =========================
   EN AVGÅNG
   ========================= */

.departure {
    display: flex;
    align-items: center;

    height: 36px;

    border-bottom: 1px solid rgba(255,255,255,0.08);
}

.departure:last-child {
    border-bottom: none;
}


/* =========================
   LINJENUMMER
   ========================= */

.line {
    width: 31px;
    height: 24px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #45a65a;
    border-radius: 7px;

    font-size: 13px;
    font-weight: 700;

    flex-shrink: 0;
}


/* =========================
   DESTINATION
   ========================= */

/*
 * FAST BREDD!
 *
 * Alla destinationer får exakt
 * samma utrymme. Därför börjar
 * alla tider på samma position.
 */

.destination {
    margin-left: 8px;

    width: 105px;
    flex: 0 0 105px;

    font-size: 12px;
    color: #eeeeee;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}


/* =========================
   AVGÅNGSTID
   ========================= */

.time {
    margin-left: 8px;

    font-size: 13px;
    font-weight: 700;

    white-space: nowrap;

    flex: 0 0 auto;
}


/* "Nu" */
.now {
    color: #55d66f;
}


/* =========================
   FELMEDDELANDE
   ========================= */

.error {
    color: #9b9ba1;
    font-size: 12px;
    margin-top: 5px;
}

</style>
</head>


<body>

<!-- RUBRIK -->

<div class="title">
    Blackeberg
</div>


<!-- AVGÅNGAR -->

<div id="departures" class="departures">
    Hämtar…
</div>


<script>

/* =========================================================
   SL / TRAFIKLAB API

   Blackeberg T-bana = site 9105
   ========================================================= */

const API =
    "https://transport.integration.sl.se/v1/sites/9105/departures";


/* =========================================================
   WIDGET WEB

   Låt Widget Web vänta på att avgångarna
   har hämtats innan den renderar widgeten.
   ========================================================= */

function __wweb2WaitMillisecondsToWidgetIsReady() {
    return 1500;
}


/* =========================================================
   FORMATERA TID

   Exempel:

   0 min  → Nu
   1 min  → 1 min
   3 min  → 3 min
   17 min → 17 min
   ========================================================= */

function formatTime(isoTime) {

    if (!isoTime) {
        return "?";
    }

    const departure =
        new Date(isoTime);

    const now =
        new Date();

    const seconds =
        Math.round(
            (
                departure.getTime() -
                now.getTime()
            ) / 1000
        );

    const minutes =
        Math.round(seconds / 60);


    if (minutes <= 0) {
        return "Nu";
    }


    return minutes + " min";
}


/* =========================================================
   HÄMTA AVGÅNGAR
   ========================================================= */

async function loadDepartures() {

    const container =
        document.getElementById("departures");


    try {

        /* Hämta SL-data */

        const response =
            await fetch(API, {
                cache: "no-store"
            });


        if (!response.ok) {

            throw new Error(
                "API error " +
                response.status
            );

        }


        const data =
            await response.json();


        /* =================================================
           HÄMTA AVGÅNGSLISTAN
           ================================================= */

        let departures =
            Array.isArray(data.departures)
                ? data.departures
                : [];


        /* =================================================
           ENDAST LINJE 17, 18 OCH 19
           ================================================= */

        departures =
            departures.filter(function(d) {

                const line =
                    String(
                        d.line?.designation ??
                        d.line?.name ??
                        d.designation ??
                        ""
                    );


                return [
                    "17",
                    "18",
                    "19"
                ].includes(line);

            });


        /* =================================================
           ENDAST:

           Hässelby strand
           Vällingby
           ================================================= */

        departures =
            departures.filter(function(d) {

                const destination =
                    String(
                        d.destination ??
                        d.direction ??
                        ""
                    ).toLowerCase();


                return (
                    destination.includes(
                        "hässelby strand"
                    ) ||

                    destination.includes(
                        "vällingby"
                    )
                );

            });


        /* =================================================
           VÄLJ TID

           expected = realtid
           planned  = tidtabell

           Vi prioriterar realtid.
           ================================================= */

        departures =
            departures
            .map(function(d) {

                return {

                    original: d,

                    time:
                        d.expected ??
                        d.planned ??
                        d.departure_time ??
                        d.time

                };

            })


            .filter(function(d) {

                return (
                    d.time &&
                    !isNaN(
                        new Date(
                            d.time
                        ).getTime()
                    )
                );

            });


        /* =================================================
           SORTERA

           Närmaste avgång först
           ================================================= */

        departures.sort(
            function(a, b) {

                return (
                    new Date(a.time) -
                    new Date(b.time)
                );

            }
        );


        /* =================================================
           ENDAST DE 4 NÄRMASTE
           ================================================= */

        departures =
            departures.slice(0, 4);


        /* =================================================
           OM INGA AVGÅNGAR HITTAS
           ================================================= */

        if (
            departures.length === 0
        ) {

            container.innerHTML =
                '<div class="error">' +
                'Inga avgångar hittades' +
                '</div>';

            return;

        }


        /* =================================================
           RENSA GAMLA AVGÅNGAR
           ================================================= */

        container.innerHTML = "";


        /* =================================================
           SKAPA VARJE AVGÅNG
           ================================================= */

        departures.forEach(
            function(item) {

                const d =
                    item.original;


                /* Linjenummer */

                const line =
                    String(
                        d.line?.designation ??
                        d.line?.name ??
                        d.designation ??
                        "?"
                    );


                /* Destination */

                const destination =
                    String(
                        d.destination ??
                        d.direction ??
                        ""
                    );


                /* Tid */

                const formatted =
                    formatTime(
                        item.time
                    );


                /* Skapa rad */

                const row =
                    document.createElement(
                        "div"
                    );


                row.className =
                    "departure";


                /* HTML */

                row.innerHTML = `

                    <div class="line">
                        ${line}
                    </div>

                    <div class="destination">
                        ${destination}
                    </div>

                    <div class="time ${
                        formatted === "Nu"
                            ? "now"
                            : ""
                    }">
                        ${formatted}
                    </div>

                `;


                container.appendChild(
                    row
                );

            }
        );

    }


    /* =====================================================
       FELHANTERING
       ===================================================== */

    catch (error) {

        console.error(error);


        container.innerHTML =
            '<div class="error">' +
            'Kunde inte hämta avgångar' +
            '</div>';

    }

}


/* =========================================================
   STARTA
   ========================================================= */

loadDepartures();

</script>

</body>
</html>
