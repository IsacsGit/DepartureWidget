<!DOCTYPE html>
<html lang="sv">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Reseplanerare</title>
<style>
/* ==========================================================================
   SL GOTHIC TYPSNITT
   ========================================================================== */
@font-face {
    font-family: 'SL Gothic Text 2';
    src: url('fonts/SLGothicText2-Medium.woff2') format('woff2'),
         url('fonts/SLGothicText2-Medium.woff') format('woff'),
         url('fonts/SLGothicText2-Medium.ttf') format('truetype');
    font-weight: 500;
    font-style: normal;
    font-display: swap;
}

@font-face {
    font-family: 'SL Gothic Text 2';
    src: url('fonts/SLGothicText2-Bold.woff2') format('woff2'),
         url('fonts/SLGothicText2-Bold.woff') format('woff'),
         url('fonts/SLGothicText2-Bold.ttf') format('truetype');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-font-smoothing: antialiased;
}

:root {
    --bg-page: #10141b;
    --card-bg: #1a1f28;
    --card-hover: #222833;
    --text-white: #f5f6f8;
    --text-subtle: #848c97;
    --metro-green: #30cb6e;
    --bus-blue: #0284c7;
    --bus-red: #d32f2f;
    --accent-blue: #388bfd;
}

html, body {
    background-color: var(--bg-page);
    color: var(--text-white);
    font-family: 'SL Gothic Text 2', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-weight: 500;
    min-height: 100vh;
}

.screen-wrapper {
    width: 100%;
    max-width: 440px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 18px 16px 50px 16px;
    overflow-x: hidden;
}

/* ================= ANIMATIONER ================= */
@keyframes slideFadeUp {
    from {
        opacity: 0;
        transform: translateY(16px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeInView {
    from {
        opacity: 0;
        transform: scale(0.98) translateY(8px);
    }
    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

/* ================= UPDATED STATUS ================= */
.update-status {
    text-align: center;
    font-size: 12px;
    color: var(--text-subtle);
    margin-bottom: 14px;
    font-weight: 500;
    letter-spacing: -0.1px;
}

/* ================= LIST VIEW ================= */
.list-container {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.journey-overview-card {
    background: var(--card-bg);
    border-radius: 24px;
    padding: 20px;
    cursor: pointer;
    box-shadow: 0 4px 18px rgba(0,0,0,0.25);
    animation: slideFadeUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) backwards;
    transition: background 0.2s ease, transform 0.15s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease;
}

.journey-overview-card:hover {
    background: var(--card-hover);
    transform: translateY(-2px);
    box-shadow: 0 8px 26px rgba(0,0,0,0.35);
}

.journey-overview-card:active {
    transform: scale(0.975);
}

.overview-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 14px;
}

.overview-times {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.6px;
}

.overview-times span {
    color: var(--text-subtle);
    font-weight: 500;
    margin: 0 4px;
}

.overview-duration {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-subtle);
}

.overview-stations {
    font-size: 14px;
    color: var(--text-subtle);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 500;
}

.overview-stations strong {
    color: var(--text-white);
    font-weight: 700;
}

.overview-badges {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.badge-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-white);
}

.badge-item.bus-blue { background: rgba(2, 132, 199, 0.2); color: #38bdf8; }
.badge-item.bus-red { background: rgba(211, 47, 47, 0.2); color: #ef5350; }
.badge-item.metro { background: rgba(48, 203, 110, 0.18); color: var(--metro-green); }
.badge-item.walk { background: #232832; color: var(--text-subtle); font-weight: 500; }
.badge-chevron { color: var(--text-subtle); font-size: 12px; }

/* ================= DETAIL VIEW ================= */
.detail-view {
    display: none;
}

.detail-view.visible {
    display: block;
    animation: fadeInView 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.list-view.hidden {
    display: none;
}

.nav-bar {
    display: flex;
    align-items: center;
    position: relative;
    padding: 8px 0 24px 0;
}

.back-circle-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--card-bg);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-white);
    cursor: pointer;
    z-index: 2;
    transition: background 0.15s ease, transform 0.1s ease;
}

.back-circle-btn:hover {
    background: var(--card-hover);
}

.back-circle-btn:active {
    transform: scale(0.92);
}

.back-circle-btn svg {
    width: 20px;
    height: 20px;
}

.nav-center-title {
    position: absolute;
    width: 100%;
    text-align: center;
    left: 0;
    top: 14px;
}

.nav-page-title {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.2px;
}

.nav-page-sub {
    font-size: 12px;
    color: var(--text-subtle);
    margin-top: 1px;
    font-weight: 500;
}

.transfer-strip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 0 10px 18px;
    color: var(--text-subtle);
    font-size: 13px;
    font-weight: 500;
    animation: slideFadeUp 0.3s ease backwards;
}

.transfer-strip svg {
    width: 13px;
    height: 13px;
    fill: currentColor;
}

.card-block {
    background-color: var(--card-bg);
    border-radius: 28px;
    padding: 22px 20px;
    position: relative;
    animation: slideFadeUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) backwards;
}

.card-corner-badge {
    position: absolute;
    top: 20px;
    right: 20px;
    display: flex;
    align-items: center;
    border-radius: 8px;
    overflow: hidden;
}

.card-corner-badge.bus-blue { background: #0284c7; }
.card-corner-badge.bus-red { background: #d32f2f; }
.card-corner-badge.metro { background: #20a05a; }

.corner-icon-box {
    width: 32px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.card-corner-badge.bus-blue .corner-icon-box { background: #0369a1; }
.card-corner-badge.bus-red .corner-icon-box { background: #b71c1c; }
.card-corner-badge.metro .corner-icon-box { background: #187a44; }
.corner-icon-box svg { width: 16px; height: 16px; fill: #ffffff; }

.corner-number-box {
    padding: 0 10px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.4px;
    color: #ffffff;
    line-height: 28px;
}

.timeline-row {
    display: grid;
    grid-template-columns: 52px 16px 1fr;
    column-gap: 12px;
}

.time-column {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    text-align: left;
}

.time-entry {
    display: flex;
    flex-direction: column;
}

.dep-time, .arr-time {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-white);
    line-height: 1.1;
}

.sched-time-crossed {
    font-size: 13px;
    color: var(--text-subtle);
    text-decoration: line-through;
    margin-top: 2px;
    font-weight: 500;
}

.travel-duration {
    font-size: 13px;
    color: var(--text-subtle);
    font-weight: 500;
    margin: 8px 0;
}

.spine-column {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    padding: 4px 0;
}

.spine-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background-color: #ffffff;
    z-index: 2;
    flex-shrink: 0;
}

.spine-bar {
    width: 4px;
    flex-grow: 1;
    border-radius: 2px;
    margin: 2px 0;
}

.spine-bar.bus-blue { background-color: var(--bus-blue); }
.spine-bar.bus-red { background-color: var(--bus-red); }
.spine-bar.metro { background-color: var(--metro-green); }
.spine-bar.dotted-walk {
    width: 4px;
    background: transparent;
    border-left: 3px dotted #ffffff;
    margin: 3px 0;
}

.info-column {
    display: flex;
    flex-direction: column;
    padding-right: 65px;
}

.station-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-white);
    line-height: 1.2;
}

.chips-cluster {
    display: flex;
    gap: 6px;
    margin: 10px 0 10px 0;
    flex-wrap: wrap;
}

.chip {
    background: #11151c;
    color: var(--text-white);
    font-size: 12px;
    font-weight: 500;
    padding: 5px 9px;
    border-radius: 7px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
}

.chip svg {
    width: 12px;
    height: 12px;
    fill: var(--text-subtle);
}

/* GRÅ TEXT SOM MATCHAR TIDERNA */
.route-desc-text {
    font-size: 13px;
    color: var(--text-subtle);
    margin-bottom: 12px;
    line-height: 1.35;
    font-weight: 500;
}

/* VISA X HÅLLPLATSER I MEDIUM */
.stops-accordion-trigger {
    background: none;
    border: none;
    color: #499bed;
    font-size: 13px;
    font-family: inherit;
    font-weight: 500;
    padding: 0;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 14px;
    transition: opacity 0.15s ease;
}

.stops-accordion-trigger:hover {
    opacity: 0.85;
}

.stops-accordion-trigger svg {
    width: 11px;
    height: 11px;
    fill: currentColor;
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

.stops-sublist {
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 0;
    padding-left: 8px;
    border-left: 2px solid #2b303c;
    transition: max-height 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease, margin-bottom 0.3s ease;
}

.stops-sublist.open {
    max-height: 350px;
    opacity: 1;
    margin-bottom: 14px;
}

.sub-stop-entry {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-subtle);
    font-weight: 500;
}

.card-block.walk-card {
    padding: 18px 20px;
}

.walk-badge-box {
    position: absolute;
    top: 18px;
    right: 20px;
    width: 28px;
    height: 28px;
    border-radius: 6px;
    background: #257fa8;
    display: flex;
    align-items: center;
    justify-content: center;
}

.walk-badge-box svg {
    width: 16px;
    height: 16px;
    fill: #ffffff;
}

.state-box {
    padding: 80px 20px;
    text-align: center;
    color: var(--text-subtle);
    font-weight: 500;
}

.loader-spinner {
    width: 28px;
    height: 28px;
    margin: 0 auto 16px;
    border: 3px solid #282e3a;
    border-top-color: #499bed;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.error-msg {
    background: rgba(239, 68, 68, 0.12);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #f87171;
    padding: 16px;
    border-radius: 16px;
    font-size: 13px;
    font-weight: 500;
}
</style>
</head>

<body>

<div class="screen-wrapper">

    <!-- STATUS TEXT -->
    <div id="updateStatus" class="update-status"></div>

    <!-- ================= LIST VIEW ================= -->
    <main id="listView" class="list-view">
        <div id="journeysList" class="list-container">
            <div class="state-box">
                <div class="loader-spinner"></div>
                <div>Söker avgångar...</div>
            </div>
        </div>
    </main>

    <!-- ================= DETAIL VIEW ================= -->
    <main id="detailView" class="detail-view">
        <nav class="nav-bar">
            <button id="backButton" class="back-circle-btn" aria-label="Tillbaka">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            </button>
            <div class="nav-center-title">
                <div class="nav-page-title">Resedetaljer</div>
                <div id="navOriginName" class="nav-page-sub">Västergöksvägen</div>
            </div>
        </nav>

        <div id="detailTimelineFlow"></div>
    </main>

</div>

<script>
const WORKER = "https://sl-transit-proxy.haxxerlikeshaxx.workers.dev";
let cachedJourneys = [];
let lastUpdatedTime = null;

/* TIME AGO HELPER */
function updateStatusText() {
    const el = document.getElementById("updateStatus");
    if (!lastUpdatedTime) {
        el.textContent = "";
        return;
    }
    const seconds = Math.floor((new Date() - lastUpdatedTime) / 1000);
    if (seconds < 20) {
        el.textContent = "Uppdaterades nyss";
    } else if (seconds < 60) {
        el.textContent = "Uppdaterades för under 1 min sedan";
    } else {
        const mins = Math.floor(seconds / 60);
        el.textContent = `Uppdaterades för ${mins} min sedan`;
    }
}

setInterval(updateStatusText, 10000);

/* HELPERS */
function cleanStationName(name) {
    if (!name) return "";
    return name.replace(/\s*\(Stockholm kn\)/gi, "").replace(/\s*\(Vinstavägen\)/gi, "").trim();
}

function cleanTime(timeStr) {
    if (!timeStr) return "";
    const parts = timeStr.split(":");
    return parts.length >= 2 ? `${parts[0]}:${parts[1]}` : timeStr;
}

function escapeHTML(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

/* REALTIME & DELAY LOGIC */
function getStopTiming(stopPoint) {
    if (!stopPoint) return { displayTime: "", schedTime: "", isDelayed: false, fullDateTime: "" };

    const schedT = stopPoint.time || "";
    const rtT = stopPoint.rtTime || "";
    const date = stopPoint.rtDate || stopPoint.date || new Date().toISOString().split('T')[0];

    const schedClean = cleanTime(schedT);
    const rtClean = cleanTime(rtT);

    const isDelayed = Boolean(rtT && rtClean !== schedClean);
    const displayTime = isDelayed ? rtClean : schedClean;

    return {
        displayTime,
        schedTime: schedClean,
        isDelayed,
        fullDateTime: `${date}T${rtT || schedT}`
    };
}

function calculateDuration(startStr, endStr) {
    try {
        const start = new Date(startStr);
        const end = new Date(endStr);
        const diffMinutes = Math.round((end - start) / 60000);
        return isNaN(diffMinutes) ? null : diffMinutes;
    } catch {
        return null;
    }
}

function getProduct(leg) {
    return Array.isArray(leg.Product) ? leg.Product[0] : leg.Product;
}

function getLineNumber(leg) {
    const p = getProduct(leg);
    if (!p) return "";
    return p.num || p.line || p.name || "";
}

function checkIfMetro(leg) {
    const p = getProduct(leg);
    const cat = (p?.catOutS || p?.catOut || p?.cat || p?.name || "").toLowerCase();
    return cat.includes("metro") || cat.includes("tunnel") || cat.includes("ult");
}

function getLineColorClass(leg) {
    if (checkIfMetro(leg)) return "metro";
    const line = String(getLineNumber(leg)).trim();
    if (line === "118") return "bus-red";
    return "bus-blue";
}

function sanitizeLegs(legs) {
    return legs.filter((leg, idx) => {
        if (leg.type === "WALK") {
            const startName = cleanStationName(leg.Origin?.name);
            const endName = cleanStationName(leg.Destination?.name);
            if (startName === endName || (idx === 0 && legs.length > 1 && legs[1].type === "JNY")) {
                return false;
            }
        }
        return leg.type === "JNY" || leg.type === "WALK";
    });
}

/* ==========================================================================
   RENDER LIST
   ========================================================================== */
function renderList() {
    const container = document.getElementById("journeysList");
    container.innerHTML = "";

    if (!cachedJourneys.length) {
        container.innerHTML = `<div class="error-msg">Inga resor hittades just nu.</div>`;
        return;
    }

    cachedJourneys.forEach((trip, index) => {
        const legs = sanitizeLegs(trip.LegList?.Leg || []);
        if (!legs.length) return;

        const originTiming = getStopTiming(legs[0].Origin);
        const destTiming = getStopTiming(legs[legs.length - 1].Destination);

        const totalDuration = calculateDuration(originTiming.fullDateTime, destTiming.fullDateTime);

        let badgesHTML = "";
        legs.forEach((leg, idx) => {
            if (idx > 0) badgesHTML += `<span class="badge-chevron">›</span>`;

            if (leg.type === "WALK") {
                const walkMin = Math.round((parseInt(leg.duration?.replace(/\D/g,'')) || 180) / 60);
                badgesHTML += `<span class="badge-item walk">Gå ${walkMin}m</span>`;
            } else {
                const line = getLineNumber(leg);
                const colorClass = getLineColorClass(leg);
                // ENDAST LINJENUMMER (INGET "Buss" ELLER "T")
                badgesHTML += `
                    <span class="badge-item ${colorClass}">
                        ${escapeHTML(line)}
                    </span>
                `;
            }
        });

        const card = document.createElement("div");
        card.className = "journey-overview-card";
        card.style.animationDelay = `${index * 0.05}s`;

        card.innerHTML = `
            <div class="overview-top">
                <div class="overview-times">
                    ${originTiming.displayTime} <span>→</span> ${destTiming.displayTime}
                </div>
                <div class="overview-duration">
                    ${totalDuration !== null ? totalDuration + ' min' : ''}
                </div>
            </div>
            <div class="overview-stations">
                <span>Från: <strong>${escapeHTML(cleanStationName(legs[0].Origin?.name))}</strong></span>
            </div>
            <div class="overview-badges">
                ${badgesHTML}
            </div>
        `;

        card.addEventListener("click", () => renderDetail(trip));
        container.appendChild(card);
    });
}

/* ==========================================================================
   RENDER DETAIL
   ========================================================================== */
function renderDetail(trip) {
    const listView = document.getElementById("listView");
    const detailView = document.getElementById("detailView");
    const timelineFlow = document.getElementById("detailTimelineFlow");
    const navOriginName = document.getElementById("navOriginName");

    const rawLegs = trip.LegList?.Leg || [];
    const legs = sanitizeLegs(rawLegs);
    if (!legs.length) return;

    navOriginName.textContent = cleanStationName(legs[0].Origin?.name);

    let html = "";

    legs.forEach((leg, idx) => {
        const origin = leg.Origin;
        const destination = leg.Destination;

        const depTiming = getStopTiming(origin);
        const arrTiming = getStopTiming(destination);

        const legDur = calculateDuration(depTiming.fullDateTime, arrTiming.fullDateTime);
        const animDelay = `${idx * 0.06}s`;

        if (idx > 0) {
            const prevDestTiming = getStopTiming(legs[idx - 1].Destination);
            const transferMin = calculateDuration(prevDestTiming.fullDateTime, depTiming.fullDateTime);

            const isNextMetro = checkIfMetro(leg);
            const targetModeText = leg.type === "WALK" ? "promenad" : (isNextMetro ? "tunnelbana" : "buss");

            html += `
                <div class="transfer-strip" style="animation-delay: ${animDelay};">
                    <span>${transferMin > 0 ? transferMin + ' min' : '< 1 min'}</span>
                    <svg viewBox="0 0 24 24"><path d="M11 4h2v12l5.5-5.5 1.42 1.42L12 19.84l-7.92-7.92L5.5 10.5 11 16V4z"/></svg>
                    <span>Byt till ${targetModeText}</span>
                </div>
            `;
        }

        if (leg.type === "WALK") {
            const distMeters = leg.dist || 240;
            html += `
                <div class="card-block walk-card" style="animation-delay: ${animDelay};">
                    <div class="walk-badge-box">
                        <svg viewBox="0 0 24 24"><path d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7z"/></svg>
                    </div>
                    <div class="timeline-row">
                        <div class="time-column">
                            <span class="dep-time">${depTiming.displayTime}</span>
                            <span class="travel-duration">${legDur !== null ? legDur + ' min' : ''}</span>
                            <span class="arr-time">${arrTiming.displayTime}</span>
                        </div>
                        <div class="spine-column">
                            <div class="spine-dot" style="background:#fff;"></div>
                            <div class="spine-bar dotted-walk"></div>
                            <div class="spine-dot" style="background:#fff;"></div>
                        </div>
                        <div class="info-column">
                            <div class="station-title">${escapeHTML(cleanStationName(origin.name))}</div>
                            <div class="route-desc-text" style="margin: 16px 0;">Gå ${distMeters} m</div>
                            <div class="station-title">${escapeHTML(cleanStationName(destination.name))}</div>
                        </div>
                    </div>
                </div>
            `;
            return;
        }

        const isMetro = checkIfMetro(leg);
        const line = getLineNumber(leg);
        const colorClass = getLineColorClass(leg);
        const direction = leg.direction ? cleanStationName(leg.direction) : "";

        const allStops = leg.Stops?.Stop || [];
        const middleStops = allStops.slice(1, allStops.length - 1);
        let intermediateHTML = "";

        if (middleStops.length > 0) {
            let listRows = "";
            middleStops.forEach(st => {
                const stopTiming = cleanTime(st.rtDepTime || st.depTime || st.rtArrTime || st.arrTime);
                listRows += `
                    <div class="sub-stop-entry">
                        <span>${escapeHTML(cleanStationName(st.name))}</span>
                        <span>${stopTiming}</span>
                    </div>
                `;
            });

            intermediateHTML = `
                <button class="stops-accordion-trigger" onclick="toggleStops(this)">
                    <span>Visa ${middleStops.length} hållplatser</span>
                    <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
                </button>
                <div class="stops-sublist">
                    ${listRows}
                </div>
            `;
        }

        html += `
            <div class="card-block" style="animation-delay: ${animDelay};">
                <div class="card-corner-badge ${colorClass}">
                    <div class="corner-icon-box">
                        ${isMetro ? 
                            '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="white" stroke-width="2" fill="none"/><path fill="white" d="M7 8h10v2h-4v7h-2v-7H7z"/></svg>' : 
                            '<svg viewBox="0 0 24 24"><path d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6H6V6h12v5z"/></svg>'
                        }
                    </div>
                    <div class="corner-number-box">${escapeHTML(line)}</div>
                </div>

                <div class="timeline-row">
                    <div class="time-column">
                        <div class="time-entry">
                            <span class="dep-time">${depTiming.displayTime}</span>
                            ${depTiming.isDelayed ? `<span class="sched-time-crossed">${depTiming.schedTime}</span>` : ''}
                        </div>

                        <span class="travel-duration">${legDur !== null ? legDur + ' min' : ''}</span>

                        <div class="time-entry">
                            <span class="arr-time">${arrTiming.displayTime}</span>
                            ${arrTiming.isDelayed ? `<span class="sched-time-crossed">${arrTiming.schedTime}</span>` : ''}
                        </div>
                    </div>

                    <div class="spine-column">
                        <div class="spine-dot"></div>
                        <div class="spine-bar ${colorClass}"></div>
                        <div class="spine-dot"></div>
                    </div>

                    <div class="info-column">
                        <div class="station-title">${escapeHTML(cleanStationName(origin.name))}</div>

                        <div class="chips-cluster">
                            ${isMetro ? '<span class="chip">Spår 4</span>' : ''}
                            <span class="chip">
                                <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                                Normalt lugnt
                            </span>
                        </div>

                        <div class="route-desc-text">
                            ${isMetro ? 'Tunnelbana Grön linje' : 'Buss'} ${escapeHTML(line)} mot ${escapeHTML(direction)}
                        </div>

                        ${intermediateHTML}

                        <div class="station-title">${escapeHTML(cleanStationName(destination.name))}</div>
                    </div>
                </div>
            </div>
        `;
    });

    timelineFlow.innerHTML = html;
    listView.classList.add("hidden");
    detailView.classList.add("visible");
    window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ACCORDION TOGGLE (MJUK ANIMATION) */
window.toggleStops = function(btn) {
    const sublist = btn.nextElementSibling;
    sublist.classList.toggle("open");
    const svg = btn.querySelector("svg");
    if (svg) {
        svg.style.transform = sublist.classList.contains("open") ? "rotate(180deg)" : "rotate(0deg)";
    }
};

document.getElementById("backButton").addEventListener("click", () => {
    document.getElementById("detailView").classList.remove("visible");
    document.getElementById("listView").classList.remove("hidden");
});

/* FETCH PIPELINE */
async function fetchJourneys() {
    const container = document.getElementById("journeysList");
    try {
        const res = await fetch(WORKER + "/resrobot/trips");
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        
        const data = await res.json();
        cachedJourneys = data.Trip || data.TripList?.Trip || [];
        if (!Array.isArray(cachedJourneys) && cachedJourneys) cachedJourneys = [cachedJourneys];

        lastUpdatedTime = new Date();
        updateStatusText();

        renderList();
    } catch (err) {
        console.error(err);
        container.innerHTML = `
            <div class="error-msg">
                <strong>Kunde inte ladda resor</strong><br><br>
                ${escapeHTML(err.message)}
            </div>
        `;
    }
}

fetchJourneys();
setInterval(fetchJourneys, 60 * 1000);
</script>
