<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="js-widget-title" content="Blackeberg">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                 "Helvetica Neue", sans-serif;
    background: #111214;
    color: white;
    padding: 15px;
}

/* Rubrik */
.title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 8px;
}

/* Avgångslista */
.departures {
    width: 100%;
}

/* En avgång */
.departure {
    display: flex;
    align-items: center;
    height: 36px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
}

.departure:last-child {
    border-bottom: none;
}

/* Linjenummer */
.line {
    width: 31px;
    height: 24px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #45a65a;
    border-radius: 7px;

    font-size: 13px;
    font-weight: 700;

    flex-shrink: 0;
}

/* Destination */
.destination {
    margin-left: 8px;

    font-size: 12px;
    color: #eeeeee;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

    flex: 1;
}

/* Tid */
.time {
    margin-left: 6px;

    font-size: 14px;
    font-weight: 700;

    min-width: 43px;
    text-align: right;
}

.now {
    color: #55d66f;
}

.error {
    color: #9b9ba1;
    font-size: 12px;
    margin-top: 5px;
}
</style>
</head>

<body>

<div class="title">
    Blackeberg
</div>

<div id="departures" class="departures">
    Hämtar…
</div>


<script>

const API =
    "https://transport.integration.sl.se/v1/sites/9105/departures";


/*
 * WidgetWeb väntar på denna funktion
 * innan den tar bilden av widgeten.
 */
function __wweb2WaitMillisecondsToWidgetIsReady() {
    return 1500;
}


/*
 * Gör om avgångstiden till:
 *
 * Nu
 * 2 min
 * 8 min
 * 17 min
 */
function formatTime(isoTime) {

    if (!isoTime) {
        return "?";
    }

    const departure = new Date(isoTime);
    const now = new Date();

    const seconds =
        Math.round(
            (departure.getTime() - now.getTime()) / 1000
        );

    const minutes =
        Math.round(seconds / 60);

    if (minutes <= 0) {
        return "Nu";
    }

    return minutes + " min";
}


async function loadDepartures() {

    const container =
        document.getElementById("departures");

    try {

        const response =
            await fetch(API, {
                cache: "no-store"
            });

        if (!response.ok) {
            throw new Error(
                "API error " + response.status
            );
        }

        const data =
            await response.json();

        let departures =
            Array.isArray(data.departures)
                ? data.departures
                : [];


        /*
         * ENDAST tunnelbana 17, 18, 19
         */
        departures =
            departures.filter(function(d) {

                const line =
                    String(
                        d.line?.designation ??
                        d.line?.name ??
                        d.designation ??
                        ""
                    );

                return (
                    ["17", "18", "19"]
                    .includes(line)
                );
            });


        /*
         * ENDAST mot Hässelby strand / Vällingby
         */
        departures =
            departures.filter(function(d) {

                const destination =
                    String(
                        d.destination ??
                        d.direction ??
                        ""
                    ).toLowerCase();

                return (
                    destination.includes("hässelby strand") ||
                    destination.includes("vällingby")
                );
            });


        /*
         * Använd realtid (expected)
         * när den finns.
         *
         * Annars planned.
         */
        departures =
            departures
            .map(function(d) {

                return {
                    original: d,

                    time:
                        d.expected ??
                        d.planned ??
                        d.departure_time ??
                        d.time
                };

            })
            .filter(function(d) {

                return (
                    d.time &&
                    !isNaN(
                        new Date(d.time).getTime()
                    )
                );

            });


        /*
         * Närmaste först
         */
        departures.sort(function(a, b) {

            return (
                new Date(a.time) -
                new Date(b.time)
            );

        });


        /*
         * Visa endast 4
         */
        departures =
            departures.slice(0, 4);


        if (departures.length === 0) {

            container.innerHTML =
                '<div class="error">' +
                'Inga avgångar hittades' +
                '</div>';

            return;
        }


        container.innerHTML = "";


        departures.forEach(function(item) {

            const d =
                item.original;


            const line =
                String(
                    d.line?.designation ??
                    d.line?.name ??
                    d.designation ??
                    "?"
                );


            const destination =
                String(
                    d.destination ??
                    d.direction ??
                    ""
                );


            const formatted =
                formatTime(item.time);


            const row =
                document.createElement("div");

            row.className =
                "departure";


            row.innerHTML = `
                <div class="line">
                    ${line}
                </div>

                <div class="destination">
                    ${destination}
                </div>

                <div class="time ${
                    formatted === "Nu"
                        ? "now"
                        : ""
                }">
                    ${formatted}
                </div>
            `;


            container.appendChild(row);

        });

    }

    catch (error) {

        console.error(error);

        container.innerHTML =
            '<div class="error">' +
            'Kunde inte hämta avgångar' +
            '</div>';
    }
}


/*
 * Starta widgeten
 */
loadDepartures();

</script>

</body>
</html>
