<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .widget {
        width: 100%;
        padding: 12px 14px;
        background: #111111;
        color: white;
        border-radius: 16px;
    }

    .title {
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 10px;
    }

    .trip-row {
        display: flex;
        align-items: center;
        min-height: 34px;
        gap: 8px;
    }

    .line {
        min-width: 42px;
        height: 26px;
        padding: 0 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 13px;
        background: #00a651;
        color: white;
        font-size: 14px;
        font-weight: 700;
        flex-shrink: 0;
    }

    .destination {
        width: 145px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 15px;
    }

    .time {
        margin-left: auto;
        font-size: 15px;
        font-weight: 600;
        white-space: nowrap;
    }

    .now {
        font-weight: 800;
    }

    .transfer {
        display: flex;
        align-items: center;
        min-height: 32px;
        padding-left: 4px;
        color: #bcbcbc;
        font-size: 13px;
    }

    .arrow {
        margin: 0 6px;
        color: #777;
    }

    .subway {
        background: #00a651;
    }

    .walking {
        color: #999;
        font-size: 12px;
        padding-left: 4px;
    }

    .error {
        color: #ff7676;
        font-size: 13px;
        line-height: 1.4;
    }

    .loading {
        color: #aaa;
        font-size: 14px;
    }
</style>
</head>

<body>

<div class="widget">
    <div class="title">Västergöksvägen → Blackeberg</div>
    <div id="content" class="loading">Hämtar resväg…</div>
</div>

<script>
/*
 * ============================================================
 * INSTÄLLNINGAR
 * ============================================================
 *
 * ResRobot kräver din egen API-nyckel.
 *
 * Klistra in DIN ResRobot v2.1-nyckel här.
 *
 * SL Transport API kräver ingen API-nyckel.
 */

const RESROBOT_KEY = "00080700-932a-4541-bed9-6a2e2aa81bd1";

const RESROBOT_BASE = "https://api.resrobot.se/v2.1";
const SL_BASE = "https://transport.integration.sl.se/v1";

const ORIGIN_NAME = "Västergöksvägen";
const DESTINATION_NAME = "Blackeberg";

const content = document.getElementById("content");


/* ============================================================
   HJÄLPFUNKTIONER
   ============================================================ */

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function normalize(value) {
    return String(value ?? "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[()]/g, "")
        .replace(/\s+/g, " ")
        .trim();
}


function timeToMinutes(time) {
    if (!time) return null;

    const match = String(time).match(/^(\d{1,2}):(\d{2})/);

    if (!match) return null;

    return Number(match[1]) * 60 + Number(match[2]);
}


function dateTimeToMs(date, time) {
    if (!date || !time) return null;

    const value = `${date}T${time}:00`;

    const ms = new Date(value).getTime();

    return Number.isNaN(ms) ? null : ms;
}


function minutesUntil(date, time) {
    const target = dateTimeToMs(date, time);

    if (target === null) return null;

    return Math.round((target - Date.now()) / 60000);
}


function formatDeparture(date, time) {
    const mins = minutesUntil(date, time);

    if (mins === null) {
        return escapeHtml(time || "");
    }

    if (mins <= 0) {
        return `<span class="now">Nu</span>`;
    }

    return `${mins} min`;
}


function getProduct(leg) {
    if (!leg) return null;

    if (Array.isArray(leg.Product)) {
        return leg.Product[0] || null;
    }

    return leg.Product || null;
}


function getLine(leg) {
    const product = getProduct(leg);

    return String(
        product?.num ??
        leg?.number ??
        leg?.name ??
        ""
    ).trim();
}


function getTransportCategory(leg) {
    const product = getProduct(leg);

    return String(
        product?.catCode ??
        product?.catOut ??
        product?.catIn ??
        ""
    ).toLowerCase();
}


function isPublicTransportLeg(leg) {
    return leg?.type === "JNY";
}


function isMetroLeg(leg) {
    const product = getProduct(leg);

    const values = [
        product?.name,
        product?.displayName,
        product?.catName,
        product?.catOut,
        product?.catIn,
        product?.catCode
    ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();

    return (
        values.includes("tunnel") ||
        values.includes("metro") ||
        values.includes("subway") ||
        values.includes("t-bana")
    );
}


async function fetchJson(url, label) {
    const response = await fetch(url, {
        cache: "no-store"
    });

    if (!response.ok) {
        throw new Error(
            `${label}: HTTP ${response.status}`
        );
    }

    let data;

    try {
        data = await response.json();
    } catch {
        throw new Error(
            `${label}: servern skickade inte giltig JSON`
        );
    }

    return data;
}


/* ============================================================
   RESROBOT
   ============================================================ */

async function resrobotLookup(name) {
    const params = new URLSearchParams({
        input: name,
        maxNo: "20",
        format: "json",
        lang: "sv",
        accessId: RESROBOT_KEY
    });

    const url =
        `${RESROBOT_BASE}/location.name?${params.toString()}`;

    const data = await fetchJson(
        url,
        `ResRobot hållplatssökning (${name})`
    );

    const stops = data?.StopLocation;

    if (!Array.isArray(stops) || stops.length === 0) {
        throw new Error(
            `ResRobot hittade ingen hållplats för "${name}".`
        );
    }

    return stops;
}


function chooseStop(stops, wantedName) {
    const wanted = normalize(wantedName);

    /*
     * 1. Exakt namn.
     */
    const exact = stops.find(
        stop => normalize(stop.name) === wanted
    );

    if (exact) return exact;

    /*
     * 2. Börja med namn som innehåller sökningen.
     */
    const contains = stops.find(
        stop => normalize(stop.name).includes(wanted)
    );

    if (contains) return contains;

    /*
     * 3. Annars första resultatet.
     */
    return stops[0];
}


async function findResRobotStop(name) {
    const stops = await resrobotLookup(name);

    return chooseStop(stops, name);
}


function buildTripUrl(originId, destinationId) {
    const now = new Date();

    const date =
        `${now.getFullYear()}-` +
        `${String(now.getMonth() + 1).padStart(2, "0")}-` +
        `${String(now.getDate()).padStart(2, "0")}`;

    const time =
        `${String(now.getHours()).padStart(2, "0")}:` +
        `${String(now.getMinutes()).padStart(2, "0")}`;

    const params = new URLSearchParams({
        format: "json",
        originId: originId,
        destId: destinationId,
        date: date,
        time: time,
        numF: "5",
        passlist: "1",
        showPassingPoints: "true",
        accessId: RESROBOT_KEY
    });

    return `${RESROBOT_BASE}/trip?${params.toString()}`;
}


async function getTrips(originId, destinationId) {
    const url = buildTripUrl(originId, destinationId);

    const data = await fetchJson(
        url,
        "ResRobot reseplanering"
    );

    if (data?.error) {
        throw new Error(
            `ResRobot: ${data.error.text || data.error.message || "okänt fel"}`
        );
    }

    const trips = data?.Trip;

    if (!Array.isArray(trips) || trips.length === 0) {
        throw new Error(
            "ResRobot returnerade inga möjliga resor."
        );
    }

    return trips;
}


/* ============================================================
   SL TRANSPORT API
   ============================================================ */

let slSitesPromise = null;


async function getSLSites() {
    if (!slSitesPromise) {
        slSitesPromise = fetchJson(
            `${SL_BASE}/sites?expand=true`,
            "SL hållplatslista"
        );
    }

    return slSitesPromise;
}


function getSiteName(site) {
    return String(
        site?.name ??
        site?.Name ??
        ""
    ).trim();
}


function findSLSite(sites, name) {
    const wanted = normalize(name);

    /*
     * Först exakt namn.
     */
    let match = sites.find(
        site => normalize(getSiteName(site)) === wanted
    );

    if (match) return match;

    /*
     * Därefter tar vi bort eventuella
     * parenteser och suffix som "(Stockholm)".
     */
    match = sites.find(site => {
        const siteName = normalize(getSiteName(site))
            .replace(/\s*\([^)]*\)\s*$/, "");

        return siteName === wanted;
    });

    if (match) return match;

    /*
     * Sist använder vi innehållsmatchning.
     */
    return sites.find(site =>
        normalize(getSiteName(site)).includes(wanted)
    );
}


async function getSLDepartures(siteId) {
    return fetchJson(
        `${SL_BASE}/sites/${encodeURIComponent(siteId)}/departures`,
        `SL avgångar för site ${siteId}`
    );
}


function departureLine(dep) {
    return String(
        dep?.line?.designation ??
        dep?.line?.name ??
        dep?.lineDesignation ??
        ""
    ).trim();
}


function departureDestination(dep) {
    return String(
        dep?.destination ??
        dep?.line?.destination ??
        ""
    ).trim();
}


function departureScheduled(dep) {
    return (
        dep?.scheduled ??
        dep?.scheduled_time ??
        dep?.scheduledTime ??
        null
    );
}


function departureExpected(dep) {
    return (
        dep?.expected ??
        dep?.expected_time ??
        dep?.expectedTime ??
        null
    );
}


function departureMinutesFromNow(dep) {
    const value =
        departureExpected(dep) ||
        departureScheduled(dep);

    if (!value) return null;

    const timestamp = new Date(value).getTime();

    if (Number.isNaN(timestamp)) {
        return null;
    }

    return Math.round(
        (timestamp - Date.now()) / 60000
    );
}


/* ============================================================
   MATCHA RESROBOT-LEG MOT SL REALTIME
   ============================================================ */

async function enrichLegWithSL(leg, sites) {
    const stopName =
        leg?.Origin?.name ||
        "";

    const line =
        getLine(leg);

    if (!stopName || !line) {
        return {
            leg,
            realtime: null
        };
    }

    const site = findSLSite(sites, stopName);

    if (!site) {
        return {
            leg,
            realtime: null
        };
    }

    const siteId =
        site?.id ??
        site?.siteId ??
        site?.SiteId;

    if (!siteId) {
        return {
            leg,
            realtime: null
        };
    }

    const data = await getSLDepartures(siteId);

    const departures =
        Array.isArray(data?.departures)
            ? data.departures
            : [];

    const targetTime =
        timeToMinutes(leg?.Origin?.time);

    const candidates = departures
        .filter(dep => {
            const depLine = departureLine(dep);

            return depLine === line;
        })
        .filter(dep => {
            const depMinutes =
                departureMinutesFromNow(dep);

            return depMinutes === null || depMinutes >= -1;
        });

    if (candidates.length === 0) {
        return {
            leg,
            realtime: null
        };
    }

    /*
     * Matcha helst den SL-avgång som ligger närmast
     * ResRobots planerade avgångstid.
     */
    let best = null;
    let bestDifference = Infinity;

    for (const dep of candidates) {
        const scheduled =
            departureScheduled(dep);

        let difference = 999999;

        if (scheduled && targetTime !== null) {
            const parsed = new Date(scheduled);

            if (!Number.isNaN(parsed.getTime())) {
                const localMinutes =
                    parsed.getHours() * 60 +
                    parsed.getMinutes();

                difference =
                    Math.abs(localMinutes - targetTime);

                /*
                 * Hantera midnatt.
                 */
                difference =
                    Math.min(
                        difference,
                        1440 - difference
                    );
            }
        }

        /*
         * Om ingen tid gick att matcha väljer vi
         * helt enkelt nästa avgång.
         */
        if (difference < bestDifference) {
            bestDifference = difference;
            best = dep;
        }
    }

    /*
     * Undvik att matcha en helt annan avgång
     * flera timmar bort.
     */
    if (best && bestDifference > 45) {
        best = null;
    }

    return {
        leg,
        realtime: best,
        site
    };
}


/* ============================================================
   VÄLJ RESA
   ============================================================ */

function getLegs(trip) {
    const legs =
        trip?.LegList?.Leg;

    if (!Array.isArray(legs)) {
        return [];
    }

    return legs;
}


function tripHasUsefulPublicTransport(trip) {
    return getLegs(trip)
        .some(isPublicTransportLeg);
}


async function enrichTrip(trip, sites) {
    const legs = getLegs(trip);

    const enriched = [];

    for (const leg of legs) {
        if (isPublicTransportLeg(leg)) {
            try {
                enriched.push(
                    await enrichLegWithSL(
                        leg,
                        sites
                    )
                );
            } catch {
                /*
                 * Om SL-uppslaget för en viss leg
                 * misslyckas låter vi ändå ResRobot-resan
                 * fortsätta fungera.
                 */
                enriched.push({
                    leg,
                    realtime: null
                });
            }
        } else {
            enriched.push({
                leg,
                realtime: null
            });
        }
    }

    return enriched;
}


function scoreTrip(enrichedTrip) {
    let score = 0;

    for (const item of enrichedTrip) {
        if (!isPublicTransportLeg(item.leg)) {
            continue;
        }

        /*
         * En realtidsmatch är bättre än enbart
         * statisk ResRobot-tid.
         */
        if (item.realtime) {
            score += 100;
        }
    }

    return score;
}


/* ============================================================
   VISA RESAN
   ============================================================ */

function renderTransportLeg(item) {
    const leg = item.leg;
    const realtime = item.realtime;

    const line = escapeHtml(
        getLine(leg)
    );

    const destination = escapeHtml(
        realtime
            ? departureDestination(realtime) ||
              leg?.direction ||
              leg?.Destination?.name ||
              ""
            : leg?.direction ||
              leg?.Destination?.name ||
              ""
    );

    /*
     * Om SL har en realtidsavgång använder vi dess
     * expected-tid. Annars använder vi ResRobots
     * statiska tid.
     */
    if (realtime) {
        const expected =
            departureExpected(realtime);

        const scheduled =
            departureScheduled(realtime);

        let timeHtml = "";

        if (expected) {
            const timestamp =
                new Date(expected).getTime();

            if (!Number.isNaN(timestamp)) {
                const mins =
                    Math.round(
                        (timestamp - Date.now()) /
                        60000
                    );

                timeHtml =
                    mins <= 0
                        ? `<span class="now">Nu</span>`
                        : `${mins} min`;
            }
        }

        if (!timeHtml && scheduled) {
            const timestamp =
                new Date(scheduled).getTime();

            if (!Number.isNaN(timestamp)) {
                const mins =
                    Math.round(
                        (timestamp - Date.now()) /
                        60000
                    );

                timeHtml =
                    mins <= 0
                        ? `<span class="now">Nu</span>`
                        : `${mins} min`;
            }
        }

        if (!timeHtml) {
            timeHtml =
                escapeHtml(
                    leg?.Origin?.time || ""
                );
        }

        return `
            <div class="trip-row">
                <div class="line ${
                    isMetroLeg(leg)
                        ? "subway"
                        : ""
                }">
                    ${line}
                </div>

                <div class="destination">
                    ${destination}
                </div>

                <div class="time">
                    ${timeHtml}
                </div>
            </div>
        `;
    }

    /*
     * Fallback till ResRobot.
     */
    return `
        <div class="trip-row">
            <div class="line ${
                isMetroLeg(leg)
                    ? "subway"
                    : ""
            }">
                ${line}
            </div>

            <div class="destination">
                ${destination}
            </div>

            <div class="time">
                ${formatDeparture(
                    leg?.Origin?.date,
                    leg?.Origin?.time
                )}
            </div>
        </div>
    `;
}


function renderTransfer(fromLeg, toLeg) {
    const from =
        escapeHtml(
            fromLeg?.Destination?.name || ""
        );

    const to =
        escapeHtml(
            toLeg?.Origin?.name || ""
        );

    /*
     * Om hållplatsen är samma behöver vi inte
     * visa "från → till".
     */
    if (
        normalize(from) ===
        normalize(to)
    ) {
        return `
            <div class="transfer">
                Byte vid ${from}
            </div>
        `;
    }

    return `
        <div class="transfer">
            Byte vid ${from}
            <span class="arrow">→</span>
            ${to}
        </div>
    `;
}


function renderWalking(leg) {
    if (!leg) return "";

    const distance =
        Number(leg.dist);

    if (
        Number.isFinite(distance) &&
        distance > 0
    ) {
        return `
            <div class="walking">
                Gå ${Math.round(distance)} m
            </div>
        `;
    }

    return `
        <div class="walking">
            Gå till nästa hållplats
        </div>
    `;
}


function renderTrip(enriched) {
    let html = "";

    for (let i = 0; i < enriched.length; i++) {
        const current =
            enriched[i];

        const leg =
            current.leg;

        if (leg.type === "WALK") {
            html += renderWalking(leg);
            continue;
        }

        if (leg.type !== "JNY") {
            continue;
        }

        html += renderTransportLeg(current);

        /*
         * Leta efter nästa kollektivtrafik-leg.
         */
        let nextIndex = i + 1;

        while (
            nextIndex < enriched.length &&
            enriched[nextIndex].leg.type !== "JNY"
        ) {
            /*
             * Om det finns en WALK mellan två
             * kollektivtrafikben visar vi den.
             */
            const intermediate =
                enriched[nextIndex].leg;

            if (intermediate.type === "WALK") {
                html += renderWalking(
                    intermediate
                );
            }

            nextIndex++;
        }

        if (nextIndex < enriched.length) {
            const next =
                enriched[nextIndex].leg;

            html += renderTransfer(
                leg,
                next
            );
        }
    }

    return html;
}


/* ============================================================
   HUVUDPROGRAM
   ============================================================ */

async function main() {

    if (
        !RESROBOT_KEY ||
        RESROBOT_KEY ===
            "PASTE_YOUR_RESROBOT_KEY_HERE"
    ) {
        throw new Error(
            "ResRobot API-nyckeln saknas. " +
            "Fyll i RESROBOT_KEY längst upp i koden."
        );
    }

    /*
     * 1. Hämta Västergöksvägen dynamiskt.
     *
     * Vi använder fortfarande den verifierade
     * hållplatsen 7449901 som första val, men gör
     * samtidigt en lookup så att koden inte är
     * beroende av ett gammalt hårdkodat ID.
     */
    let origin;

    try {
        origin = await findResRobotStop(
            ORIGIN_NAME
        );
    } catch (error) {
        /*
         * Känd verifierad ResRobot-hållplats:
         * Västergöksvägen = 7449901.
         *
         * Fallback om location.name skulle
         * ligga nere.
         */
        origin = {
            name: ORIGIN_NAME,
            extId: "7449901"
        };
    }

    if (!origin?.extId) {
        throw new Error(
            `Hittade Västergöksvägen men inget ResRobot-id.`
        );
    }


    /*
     * 2. Hämta Blackeberg.
     */
    const destination =
        await findResRobotStop(
            DESTINATION_NAME
        );

    if (!destination?.extId) {
        throw new Error(
            `Hittade Blackeberg men inget ResRobot-id.`
        );
    }


    /*
     * 3. Hämta möjliga resor.
     */
    const trips =
        await getTrips(
            origin.extId,
            destination.extId
        );


    /*
     * 4. Hämta SL:s site-lista.
     */
    const sites =
        await getSLSites();

    if (!Array.isArray(sites)) {
        throw new Error(
            "SL returnerade ingen giltig hållplatslista."
        );
    }


    /*
     * 5. Lägg på SL realtidsdata.
     */
    const enrichedTrips = [];

    for (const trip of trips) {
        if (!tripHasUsefulPublicTransport(trip)) {
            continue;
        }

        const enriched =
            await enrichTrip(
                trip,
                sites
            );

        enrichedTrips.push(enriched);
    }


    if (enrichedTrips.length === 0) {
        throw new Error(
            "ResRobot hittade resor, men ingen innehöll kollektivtrafik."
        );
    }


    /*
     * 6. Välj den resa där vi lyckats få
     * realtidsdata från SL.
     *
     * Om flera är lika bra tar vi den första.
     */
    enrichedTrips.sort(
        (a, b) =>
            scoreTrip(b) -
            scoreTrip(a)
    );

    const selected =
        enrichedTrips[0];


    /*
     * 7. Rita.
     */
    const html =
        renderTrip(selected);

    if (!html.trim()) {
        throw new Error(
            "Resan hämtades men kunde inte visas."
        );
    }

    content.innerHTML = html;
}


/* ============================================================
   START + FELHANTERING
   ============================================================ */

main()
    .catch(error => {
        console.error(
            "Västergöksvägen → Blackeberg:",
            error
        );

        content.innerHTML = `
            <div class="error">
                ${escapeHtml(
                    error?.message ||
                    "Okänt fel"
                )}
            </div>
        `;
    });


/*
 * WidgetWeb readiness hook.
 */
window.addEventListener(
    "load",
    () => {
        if (
            typeof window.WidgetWeb !==
            "undefined"
        ) {
            window.WidgetWeb.ready();
        }
    }
);
</script>

</body>
</html>
