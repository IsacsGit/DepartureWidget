<!DOCTYPE html>
<html lang="sv">

<head>

<meta charset="UTF-8">

<meta
    name="js-widget-title"
    content="Västergöksvägen till Blackeberg"
>

<style>

/* =========================================================
   BAS
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;
}

body {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        sans-serif;

    background: #111214;

    color: white;

    padding: 15px;
}


/* =========================================================
   RUBRIK
   ========================================================= */

.title {

    font-size: 16px;

    font-weight: 700;

    margin-bottom: 8px;
}


/* =========================================================
   AVGÅNGSLISTA
   ========================================================= */

.departures {

    width: 100%;
}


/* =========================================================
   AVGÅNGSRAD
   ========================================================= */

.departure {

    display: flex;

    align-items: center;

    height: 36px;

    border-bottom:
        1px solid
        rgba(255,255,255,0.08);
}

.departure:last-child {

    border-bottom: none;
}


/* =========================================================
   LINJENUMMER
   ========================================================= */

.line {

    width: 31px;

    height: 24px;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #45a65a;

    border-radius: 7px;

    font-size: 13px;

    font-weight: 700;

    flex-shrink: 0;
}


/* =========================================================
   DESTINATION

   FAST BREDD!

   Alla tider börjar därför på exakt
   samma position.
   ========================================================= */

.destination {

    margin-left: 8px;

    width: 105px;

    flex: 0 0 105px;

    font-size: 12px;

    color: #eeeeee;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =========================================================
   TID
   ========================================================= */

.time {

    margin-left: 8px;

    font-size: 13px;

    font-weight: 700;

    white-space: nowrap;

    flex: 0 0 auto;
}


/* =========================================================
   "NU"
   ========================================================= */

.now {

    color: #55d66f;
}


/* =========================================================
   FELTEXT
   ========================================================= */

.error {

    color: #9b9ba1;

    font-size: 12px;

    margin-top: 5px;
}

</style>

</head>


<body>


<!-- =======================================================
     RUBRIK
     ======================================================= -->

<div class="title">
    Västergöksv. → Blackeberg
</div>


<!-- =======================================================
     AVGÅNGAR
     ======================================================= -->

<div
    id="departures"
    class="departures"
>
    Hämtar resväg…
</div>


<script>


/* =========================================================
   RESROBOT V2.1 API KONFIGURATION

   API-Nyckel: Din Trafiklab-nyckel
   Västergöksvägen ID = 740049443
   Blackeberg ID      = 740020110
   ========================================================= */

const API_KEY =
    "00080700-932a-4541-bed9-6a2e2aa81bd1";

const ORIGIN_ID =
    "740049443";

const DEST_ID =
    "740020110";


/* =========================================================
   WIDGETWEB

   WidgetWeb väntar på denna funktion innan
   den tar sin bild av sidan.

   Vi ger API-anropet lite tid att bli klart.
   ========================================================= */

function __wweb2WaitMillisecondsToWidgetIsReady(
    currentDelayMs
) {

    return 2000;
}


/* =========================================================
   FORMATERA AVGÅNGSTID

   Omvandlar datum och tid från API:et till minuter.

   Exempel:

   0 min  -> Nu
   1 min  -> 1 min
   3 min  -> 3 min
   12 min -> 12 min
   ========================================================= */

function formatTime(
    dateStr,
    timeStr
) {

    if (
        !dateStr ||
        !timeStr
    ) {

        return "?";
    }


    const departure =
        new Date(
            dateStr +
            "T" +
            timeStr
        );


    const now =
        new Date();


    const differenceMs =
        departure.getTime() -
        now.getTime();


    const differenceMinutes =
        Math.ceil(
            differenceMs / 60000
        );


    if (
        differenceMinutes <= 0
    ) {

        return "Nu";
    }


    return (
        differenceMinutes +
        " min"
    );
}


/* =========================================================
   HÄMTA RESVÄG
   ========================================================= */

async function loadTrip() {


    const container =
        document.getElementById(
            "departures"
        );


    try {


        /* =================================================
           CORS PROXY + RESROBOT TRIP API
           
           Eftersom anropet görs i en widget/lokalt 
           skickar vi anropet genom corsproxy.io för 
           att undvika att webbläsaren blockerar det.
           ================================================= */

        const targetUrl =
            "https://api.resrobot.se/v2.1/trip" +
            "?accessId=" + API_KEY +
            "&originId=" + ORIGIN_ID +
            "&destId=" + DEST_ID +
            "&format=json" +
            "&numF=4";

        const url =
            "https://corsproxy.io/?" +
            encodeURIComponent(
                targetUrl
            );


        /* =================================================
           HÄMTA FÄRSK DATA
           ================================================= */

        const response =
            await fetch(
                url,
                {
                    cache: "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "API svarade med status: " +
                response.status
            );
        }


        const data =
            await response.json();


        /* =================================================
           VALIDERA DATAN FRÅN RESROBOT
           ================================================= */

        if (
            !data ||
            !Array.isArray(
                data.Trip
            )
        ) {

            throw new Error(
                "Inga resor hittades i API-svaret"
            );
        }


        let trips =
            data.Trip;


        /* =================================================
           RENSA LADDNINGSTEXT
           ================================================= */

        container.innerHTML =
            "";


        /* =================================================
           BEARBETA OCH VISA RESTERANDE RESOR (MAX 4)
           ================================================= */

        trips
            .slice(0, 4)
            .forEach(
                function(trip) {


                    /* =====================================
                       HÄMTA FÖRSTA BENET (LEG) PÅ RESAN
                       ===================================== */

                    const legs =
                        Array.isArray(
                            trip.LegList?.Leg
                        )
                            ? trip.LegList.Leg
                            : [trip.LegList?.Leg];


                    const firstLeg =
                        legs[0];


                    if (
                        !firstLeg
                    ) {

                        return;
                    }


                    /* Linjenummer */

                    const line =
                        String(
                            firstLeg.Product?.displayNumber ??
                            firstLeg.name ??
                            "?"
                        )
                        .trim();


                    /* Destination / Hållplats */

                    const destination =
                        "Blackeberg";


                    /* Realtid vs Ordinarie tid */

                    const depDate =
                        firstLeg.Origin?.rtDate ??
                        firstLeg.Origin?.date;

                    const depTime =
                        firstLeg.Origin?.rtTime ??
                        firstLeg.Origin?.time;


                    /* Tid-formatering */

                    const formattedTime =
                        formatTime(
                            depDate,
                            depTime
                        );


                    /* Skapa rad element */

                    const row =
                        document.createElement(
                            "div"
                        );


                    row.className =
                        "departure";


                    /* =====================================
                       HTML FÖR RADEN
                       ===================================== */

                    row.innerHTML = `

                        <div class="line">
                            ${line}
                        </div>

                        <div class="destination">
                            ${destination}
                        </div>

                        <div
                            class="time ${
                                formattedTime === "Nu"
                                    ? "now"
                                    : ""
                            }"
                        >
                            ${formattedTime}
                        </div>

                    `;


                    container.appendChild(
                        row
                    );

                }
            );


    }


    catch (
        error
    ) {


        console.error(
            error
        );


        container.innerHTML =
            '<div class="error">' +
            'Kunde inte hämta resväg' +
            '</div>';


        /*
         * WidgetWeb Developer Mode
         */

        if (
            typeof __wweb2Log ===
            "function"
        ) {

            __wweb2Log(
                "ResRobot error: " +
                error.message
            );

        }

    }

}


/* =========================================================
   STARTA
   ========================================================= */

loadTrip();

</script>


</body>

</html>
