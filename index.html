<!-- LEAFLET FÖR KARTAN -->

<style>
* {

    padding: 0;

}

:root {
    --bg-page: #10141b;
    --card-bg: #1a1f28;
    --card-hover: #222833;

    --text-subtle: #848c97;

html, body {

    color: var(--text-white);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

}

.screen-wrapper {

}

}

}

.journey-overview-card:active {

}

.overview-top {

    align-items: baseline;

}

.overview-times {

}

.overview-times span {

.overview-duration {

}

<body>

<div class="screen-wrapper">

    <div id="updateStatus" class="update-status"></div>

    <!-- LIST VIEW -->

        <div id="journeysList" class="list-container">

    <!-- DETAIL VIEW -->
    <main id="detailView" class="detail-view">
        <nav class="nav-bar">
            <button id="backButton" class="back-circle-btn" aria-label="Tillbaka">

            </button>

                <div class="nav-page-title">Resedetaljer</div>
            </div>
        </nav>

        <div class="map-card-wrapper">
            <div id="routeMap"></div>
            <div class="map-summary-bar">
                <div class="item">
                    <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                    <span id="mapDurationText">26 min</span>
                </div>
                <div class="item">
                    <svg viewBox="0 0 24 24"><path d="M16 17.01V10h-2v7.01h-3L15 21l4-3.99h-3zM9 3L5 6.99h3V14h2V6.99h3L9 3z"/></svg>
                    <span id="mapTransfersText">1 byte</span>
                </div>

        <div id="detailTimelineFlow"></div>

<script>
const WORKER = "https://sl-transit-proxy.haxxerlikeshaxx.workers.dev";
let cachedJourneys = [];
let lastUpdatedTime = null;
let leafletMap = null;
let mapLayers = [];
let liveVehicleMarkers = [];
let vehiclePollingTimer = null;

function cleanStationName(name) {
    if (!name) return "";
    return name.replace(/\s*\(Stockholm kn\)/gi, "").replace(/\s*\(Vinstavägen\)/gi, "").trim();
}

function cleanTime(timeStr) {
    if (!timeStr) return "";
    const parts = timeStr.split(":");
    return parts.length >= 2 ? `${parts[0]}:${parts[1]}` : timeStr;
}

function escapeHTML(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function getStopTiming(stopPoint) {
    if (!stopPoint) return { displayTime: "", schedTime: "", isDelayed: false, fullDateTime: "" };
    const schedT = stopPoint.time || "";
    const rtT = stopPoint.rtTime || "";
    const date = stopPoint.rtDate || stopPoint.date || new Date().toISOString().split('T')[0];
    const schedClean = cleanTime(schedT);
    const rtClean = cleanTime(rtT);
    const isDelayed = Boolean(rtT && rtClean !== schedClean);
    return {
        displayTime: isDelayed ? rtClean : schedClean,
        schedTime: schedClean,
        isDelayed,
        fullDateTime: `${date}T${rtT || schedT}`
    };
}

function calculateDuration(startStr, endStr) {
    try {
        const start = new Date(startStr);
        const end = new Date(endStr);
        const diff = Math.round((end - start) / 60000);
        return isNaN(diff) ? null : diff;
    } catch { return null; }
}

function getProduct(leg) {
    return Array.isArray(leg.Product) ? leg.Product[0] : leg.Product;
}

function getLineNumber(leg) {
    const p = getProduct(leg);
    return p ? (p.num || p.line || p.name || "") : "";
}

function checkIfMetro(leg) {
    const p = getProduct(leg);
    const cat = (p?.catOutS || p?.catOut || p?.cat || p?.name || "").toLowerCase();
    return cat.includes("metro") || cat.includes("tunnel") || cat.includes("ult");
}

function getLineColorClass(leg) {
    if (checkIfMetro(leg)) return "metro";
    const line = String(getLineNumber(leg)).trim();
    if (line === "118") return "bus-red";
    return "bus-blue";
}

function getHexColor(leg) {
    if (checkIfMetro(leg)) return "#20a05a";
    const line = String(getLineNumber(leg)).trim();
    if (line === "118") return "#d32f2f";
    return "#0284c7";
}

function sanitizeLegs(legs) {
    return legs.filter((leg, idx) => {
        if (leg.type === "WALK") {
            const startName = cleanStationName(leg.Origin?.name);
            const endName = cleanStationName(leg.Destination?.name);
            if (startName === endName || (idx === 0 && legs.length > 1 && legs[1].type === "JNY")) {
                return false;
            }
        }
        return leg.type === "JNY" || leg.type === "WALK";
    });
}

/* ==========================================================================
   KARTA: AVKODA RESROBOT POLYLINE (KURVOR & GATOR)
   ========================================================================== */
function initOrClearMap() {
    if (!leafletMap) {
        leafletMap = L.map('routeMap', {
            zoomControl: false,
            attributionControl: false
        }).setView([59.36, 17.88], 13);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_labels_under/{z}/{x}/{y}{r}.png', {
            maxZoom: 19
        }).addTo(leafletMap);
    }

    mapLayers.forEach(l => leafletMap.removeLayer(l));
    mapLayers = [];
    liveVehicleMarkers.forEach(m => leafletMap.removeLayer(m));
    liveVehicleMarkers = [];
}

// ResRobot skickar koordinatpar: x,y,deltaX,deltaY...
function parseResRobotPolyline(polylineObj) {
    if (!polylineObj || !polylineObj.crd) return [];
    const crd = polylineObj.crd;
    const points = [];
    
    // ResRobot format: lista med [lon, lat, lon, lat...] eller deltas
    if (Array.isArray(crd)) {
        let lastLat = 0;
        let lastLon = 0;
        for (let i = 0; i < crd.length; i += 2) {
            const lon = (lastLon + crd[i]) / 1000000;
            const lat = (lastLat + crd[i + 1]) / 1000000;
            lastLon += crd[i];
            lastLat += crd[i + 1];
            points.push([lat, lon]);
        }
    }
    return points;
}

function drawRouteOnMap(legs) {
    initOrClearMap();
    const latLngBounds = [];

    legs.forEach((leg) => {
        const isWalk = leg.type === "WALK";
        const color = isWalk ? "#718096" : getHexColor(leg);
        let points = [];

        // 1. Försök hämta detaljerad geometri från polyline (om poly=1 skickats)
        if (leg.Polyline) {
            points = parseResRobotPolyline(leg.Polyline);
        }

        // 2. Fallback: Hållplatserna
        if (!points.length) {
            const stops = leg.Stops?.Stop || [leg.Origin, leg.Destination].filter(Boolean);
            stops.forEach(st => {
                if (st.lat && st.lon) points.push([st.lat, st.lon]);
            });
        }

        points.forEach(pt => latLngBounds.push(pt));

        if (points.length >= 2) {
            const polyline = L.polyline(points, {
                color: color,
                weight: isWalk ? 4 : 6,
                dashArray: isWalk ? "5, 8" : null,
                lineCap: "round",
                lineJoin: "round",
                opacity: 0.95
            }).addTo(leafletMap);
            mapLayers.push(polyline);
        }

        // Start och slutpunkter för varje delsträcka
        if (points.length > 0) {
            [points[0], points[points.length - 1]].forEach(pt => {
                const marker = L.circleMarker(pt, {
                    radius: 5,
                    color: "#ffffff",
                    weight: 3,
                    fillColor: color,
                    fillOpacity: 1
                }).addTo(leafletMap);
                mapLayers.push(marker);
            });
        }
    });

    if (latLngBounds.length > 0) {
        leafletMap.fitBounds(latLngBounds, { padding: [35, 35] });
        setTimeout(() => leafletMap.invalidateSize(), 150);
    }
}

/* ==========================================================================
   GTFS-REALTIME: LÄTTVIKTIG DECODER FÖR FORDONSPOSITIONER
   ========================================================================== */
// Enkel binär parser för Protocol Buffers så vi slipper externa bibliotek som blockeras
function parseVehiclesFromRawBuffer(buffer) {
    const view = new DataView(buffer);
    const vehicles = [];
    let offset = 0;

    // Söker igenom GTFS-RT PB-strömmen efter koordinater (lat/lon)
    while (offset < buffer.byteLength - 20) {
        // Hitta flyttal som matchar Stockholms latitud (ca 59.2 till 59.5)
        const val = view.getFloat32(offset, true);
        if (val > 59.20 && val < 59.55) {
            const lat = val;
            const nextVal = view.getFloat32(offset + 4, true);
            const prevVal = view.getFloat32(offset - 4, true);
            
            let lon = 0;
            if (nextVal > 17.6 && nextVal < 18.3) lon = nextVal;
            else if (prevVal > 17.6 && prevVal < 18.3) lon = prevVal;

            if (lon !== 0) {
                // Leta bakåt i närheten efter textsträngar för linjenummer (179, 118 eller 17)
                let matchedLine = null;
                const searchStart = Math.max(0, offset - 150);
                let chunk = "";
                for (let j = searchStart; j < offset; j++) {
                    chunk += String.fromCharCode(view.getUint8(j));
                }
                
                if (chunk.includes("179")) matchedLine = "179";
                else if (chunk.includes("118")) matchedLine = "118";
                else if (chunk.includes("17") || chunk.includes("19")) matchedLine = "metro";

                if (matchedLine) {
                    vehicles.push({ lat, lon, line: matchedLine });
                    offset += 16; // Hoppa framåt
                }
            }
        }
        offset++;
    }
    return vehicles;
}

async function fetchAndPlotLiveVehicles(legs) {
    try {
        const response = await fetch(WORKER + "/gtfs/realtime/vehicles");
        if (!response.ok) return;

        const buffer = await response.arrayBuffer();
        const foundVehicles = parseVehiclesFromRawBuffer(buffer);

        // Rensa gamla fordon
        liveVehicleMarkers.forEach(m => leafletMap.removeLayer(m));
        liveVehicleMarkers = [];

        const myLegLines = legs.filter(l => l.type === "JNY").map(l => ({
            num: String(getLineNumber(l)).trim(),
            isMetro: checkIfMetro(l),
            colorClass: getLineColorClass(l)
        }));

        foundVehicles.forEach(v => {
            const match = myLegLines.find(m => m.num === v.line || (m.isMetro && v.line === "metro"));
            if (match) {
                const iconSvg = match.isMetro ? 
                    '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="white" stroke-width="2" fill="none"/><path fill="white" d="M7 8h10v2h-4v7h-2v-7H7z"/></svg>' :
                    '<svg viewBox="0 0 24 24"><path d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6H6V6h12v5z"/></svg>';

                const customIcon = L.divIcon({
                    html: `<div class="live-vehicle-marker ${match.colorClass}">${iconSvg}</div>`,
                    className: '',
                    iconSize: [26, 26],
                    iconAnchor: [13, 13]
                });

                const marker = L.marker([v.lat, v.lon], { icon: customIcon }).addTo(leafletMap);
                liveVehicleMarkers.push(marker);
            }
        });
    } catch (e) {
        console.warn("Fordonspositionering misslyckades:", e);
    }
}

/* ==========================================================================
   RENDERINGSFUNKTIONER
   ========================================================================== */
function renderDetail(trip) {
    const listView = document.getElementById("listView");
    const detailView = document.getElementById("detailView");
    const timelineFlow = document.getElementById("detailTimelineFlow");

    const rawLegs = trip.LegList?.Leg || [];
    const legs = sanitizeLegs(rawLegs);
    if (!legs.length) return;

    drawRouteOnMap(legs);

    if (vehiclePollingTimer) clearInterval(vehiclePollingTimer);
    fetchAndPlotLiveVehicles(legs);
    vehiclePollingTimer = setInterval(() => fetchAndPlotLiveVehicles(legs), 15000);

    const originTiming = getStopTiming(legs[0].Origin);
    const destTiming = getStopTiming(legs[legs.length - 1].Destination);
    const totalDuration = calculateDuration(originTiming.fullDateTime, destTiming.fullDateTime);
    const transfersCount = legs.filter(l => l.type === "JNY").length - 1;

    document.getElementById("mapDurationText").textContent = `${totalDuration || 26} min`;
    document.getElementById("mapTransfersText").textContent = `${Math.max(0, transfersCount)} byte${transfersCount === 1 ? '' : 'n'}`;

    let html = "";

    legs.forEach((leg, idx) => {
        const origin = leg.Origin;
        const destination = leg.Destination;
        const depTiming = getStopTiming(origin);
        const arrTiming = getStopTiming(destination);
        const legDur = calculateDuration(depTiming.fullDateTime, arrTiming.fullDateTime);

        if (idx > 0) {
            const prevDestTiming = getStopTiming(legs[idx - 1].Destination);
            const transferMin = calculateDuration(prevDestTiming.fullDateTime, depTiming.fullDateTime);
            const isNextMetro = checkIfMetro(leg);
            const targetModeText = leg.type === "WALK" ? "promenad" : (isNextMetro ? "tunnelbana" : "buss");

            html += `
                <div class="transfer-strip">
                    <span>${transferMin > 0 ? transferMin + ' min' : '< 1 min'}</span>
                    <svg viewBox="0 0 24 24"><path d="M11 4h2v12l5.5-5.5 1.42 1.42L12 19.84l-7.92-7.92L5.5 10.5 11 16V4z"/></svg>
                    <span>Byt till ${targetModeText}</span>
                </div>
            `;
        }

        if (leg.type === "WALK") {
            const distMeters = leg.dist || 240;
            html += `
                <div class="card-block walk-card">
                    <div class="walk-badge-box">
                        <svg viewBox="0 0 24 24"><path d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7z"/></svg>
                    </div>
                    <div class="timeline-row">
                        <div class="time-column">
                            <span class="dep-time">${depTiming.displayTime}</span>
                            <span class="travel-duration">${legDur !== null ? legDur + ' min' : ''}</span>
                            <span class="arr-time">${arrTiming.displayTime}</span>
                        </div>
                        <div class="spine-column">
                            <div class="spine-dot" style="background:#fff;"></div>
                            <div class="spine-bar dotted-walk"></div>
                            <div class="spine-dot" style="background:#fff;"></div>
                        </div>
                        <div class="info-column">
                            <div class="station-title">${escapeHTML(cleanStationName(origin.name))}</div>
                            <div class="route-desc-text" style="margin: 16px 0;">Gå ${distMeters} m</div>
                            <div class="station-title">${escapeHTML(cleanStationName(destination.name))}</div>
                        </div>
                    </div>
                </div>
            `;
            return;
        }

        const isMetro = checkIfMetro(leg);
        const line = getLineNumber(leg);
        const colorClass = getLineColorClass(leg);
        const direction = leg.direction ? cleanStationName(leg.direction) : "";

        const allStops = leg.Stops?.Stop || [];
        const middleStops = allStops.slice(1, allStops.length - 1);
        let intermediateHTML = "";

        if (middleStops.length > 0) {
            let listRows = "";
            middleStops.forEach(st => {
                const stopTiming = cleanTime(st.rtDepTime || st.depTime || st.rtArrTime || st.arrTime);
                listRows += `
                    <div class="sub-stop-entry">
                        <span>${escapeHTML(cleanStationName(st.name))}</span>
                        <span>${stopTiming}</span>
                    </div>
                `;
            });

            intermediateHTML = `
                <button class="stops-accordion-trigger" onclick="toggleStops(this)">
                    <span>Visa ${middleStops.length} hållplatser</span>
                    <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
                </button>
                <div class="stops-sublist">
                    ${listRows}
                </div>
            `;
        }

        html += `
            <div class="card-block">
                <div class="card-corner-badge ${colorClass}">
                    <div class="corner-icon-box">
                        ${isMetro ? 
                            '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="white" stroke-width="2" fill="none"/><path fill="white" d="M7 8h10v2h-4v7h-2v-7H7z"/></svg>' : 
                            '<svg viewBox="0 0 24 24"><path d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6H6V6h12v5z"/></svg>'
                        }
                    </div>
                    <div class="corner-number-box">${escapeHTML(line)}</div>
                </div>

                <div class="timeline-row">
                    <div class="time-column">
                        <div class="time-entry">
                            <span class="dep-time">${depTiming.displayTime}</span>
                            ${depTiming.isDelayed ? `<span class="sched-time-crossed">${depTiming.schedTime}</span>` : ''}
                        </div>

                        <span class="travel-duration">${legDur !== null ? legDur + ' min' : ''}</span>

                        <div class="time-entry">
                            <span class="arr-time">${arrTiming.displayTime}</span>
                            ${arrTiming.isDelayed ? `<span class="sched-time-crossed">${arrTiming.schedTime}</span>` : ''}
                        </div>
                    </div>

                    <div class="spine-column">
                        <div class="spine-dot"></div>
                        <div class="spine-bar ${colorClass}"></div>
                        <div class="spine-dot"></div>
                    </div>

                    <div class="info-column">
                        <div class="station-title">${escapeHTML(cleanStationName(origin.name))}</div>

                        <div class="chips-cluster">
                            ${isMetro ? '<span class="chip">Spår 4</span>' : ''}
                            <span class="chip">
                                <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                                Normalt lugnt
                            </span>
                        </div>

                        <div class="route-desc-text">
                            ${isMetro ? 'Tunnelbana Grön linje' : 'Buss'} ${escapeHTML(line)} mot ${escapeHTML(direction)}
                        </div>

                        ${intermediateHTML}

                        <div class="station-title">${escapeHTML(cleanStationName(destination.name))}</div>
                    </div>
                </div>
            </div>
        `;
    });

    timelineFlow.innerHTML = html;
    listView.classList.add("hidden");
    detailView.classList.add("visible");
    window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderList() {
    const container = document.getElementById("journeysList");
    container.innerHTML = "";

    if (!cachedJourneys.length) {
        container.innerHTML = `<div class="state-box">Inga resor hittades just nu.</div>`;
        return;
    }

    cachedJourneys.forEach((trip) => {
        const legs = sanitizeLegs(trip.LegList?.Leg || []);
        if (!legs.length) return;

        const originTiming = getStopTiming(legs[0].Origin);
        const destTiming = getStopTiming(legs[legs.length - 1].Destination);
        const totalDuration = calculateDuration(originTiming.fullDateTime, destTiming.fullDateTime);

        let badgesHTML = "";
        legs.forEach((leg, idx) => {
            if (idx > 0) badgesHTML += `<span class="badge-chevron">›</span>`;

            if (leg.type === "WALK") {
                const walkMin = Math.round((parseInt(leg.duration?.replace(/\D/g,'')) || 180) / 60);
                badgesHTML += `<span class="badge-item walk">Gå ${walkMin}m</span>`;
            } else {
                const line = getLineNumber(leg);
                const isT = checkIfMetro(leg);
                const colorClass = getLineColorClass(leg);
                badgesHTML += `
                    <span class="badge-item ${colorClass}">
                        ${isT ? 'T' : 'Buss'} ${escapeHTML(line)}
                    </span>
                `;
            }
        });

        const card = document.createElement("div");
        card.className = "journey-overview-card";
        card.innerHTML = `
            <div class="overview-top">
                <div class="overview-times">
                    ${originTiming.displayTime} <span>→</span> ${destTiming.displayTime}
                </div>
                <div class="overview-duration">
                    ${totalDuration !== null ? totalDuration + ' min' : ''}
                </div>
            </div>
            <div class="overview-stations">
                <span>Från: <strong>${escapeHTML(cleanStationName(legs[0].Origin?.name))}</strong></span>
            </div>
            <div class="overview-badges">
                ${badgesHTML}
            </div>
        `;

        card.addEventListener("click", () => renderDetail(trip));
        container.appendChild(card);
    });
}

window.toggleStops = function(btn) {
    const sublist = btn.nextElementSibling;
    sublist.classList.toggle("open");
    const svg = btn.querySelector("svg");
    if (svg) svg.style.transform = sublist.classList.contains("open") ? "rotate(180deg)" : "rotate(0deg)";
};

document.getElementById("backButton").addEventListener("click", () => {
    if (vehiclePollingTimer) clearInterval(vehiclePollingTimer);
    document.getElementById("detailView").classList.remove("visible");
    document.getElementById("listView").classList.remove("hidden");
});

function updateStatusText() {
    const el = document.getElementById("updateStatus");
    if (!lastUpdatedTime) { el.textContent = ""; return; }
    const seconds = Math.floor((new Date() - lastUpdatedTime) / 1000);
    if (seconds < 20) el.textContent = "Uppdaterades nyss";
    else if (seconds < 60) el.textContent = "Uppdaterades för under 1 min sedan";
    else el.textContent = `Uppdaterades för ${Math.floor(seconds / 60)} min sedan`;
}
setInterval(updateStatusText, 10000);

async function fetchJourneys() {
    const container = document.getElementById("journeysList");
    try {
        const res = await fetch(WORKER + "/resrobot/trips");
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        
        const data = await res.json();
        cachedJourneys = data.Trip || data.TripList?.Trip || [];
        if (!Array.isArray(cachedJourneys) && cachedJourneys) cachedJourneys = [cachedJourneys];

        lastUpdatedTime = new Date();
        updateStatusText();

        renderList();
    } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="state-box">Kunde inte hämta resor.<br>${escapeHTML(err.message)}</div>`;
    }
}

fetchJourneys();
setInterval(fetchJourneys, 60 * 1000);
</script>

</body>
</html>
