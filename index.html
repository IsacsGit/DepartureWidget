<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="js-widget-title" content="Blackeberg T-bana">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                 "Helvetica Neue", sans-serif;
    background: #111214;
    color: #ffffff;
    padding: 16px;
}

.header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 2px;
}

.metro-icon {
    font-size: 18px;
}

.title {
    font-size: 16px;
    font-weight: 700;
}

.subtitle {
    font-size: 11px;
    color: #9b9ba1;
    margin-left: 27px;
    margin-bottom: 12px;
}

.departures {
    width: 100%;
}

.departure {
    display: flex;
    align-items: center;
    height: 35px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
}

.departure:last-child {
    border-bottom: none;
}

.line {
    width: 32px;
    height: 25px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #46a65c;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 700;
}

.destination {
    flex: 1;
    margin-left: 10px;
    font-size: 12px;
    color: #eeeeee;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.time {
    font-size: 14px;
    font-weight: 700;
    min-width: 45px;
    text-align: right;
}

.now {
    color: #55d66f;
}

.error {
    color: #9b9ba1;
    font-size: 12px;
    margin-top: 8px;
}

.footer {
    margin-top: 5px;
    font-size: 8px;
    color: #66676c;
}

</style>
</head>

<body>

<div class="header">
    <div class="metro-icon">🚇</div>
    <div class="title">Blackeberg</div>
</div>

<div class="subtitle">
    Mot Hässelby strand / Vällingby
</div>

<div id="departures" class="departures">
    Hämtar avgångar…
</div>

<div class="footer">
    Data från Trafiklab.se
</div>

<script>

const API =
    "https://transport.integration.sl.se/v1/sites/9105/departures";


/*
 * WidgetWeb behöver få lite extra tid eftersom
 * avgångarna hämtas asynkront.
 */
function __wweb2WaitMillisecondsToWidgetIsReady(currentDelayMs) {
    return 1500;
}


/*
 * Gör "3 min", "Nu", osv.
 */
function formatTime(isoTime) {

    if (!isoTime) {
        return "?";
    }

    const departure = new Date(isoTime);
    const now = new Date();

    const seconds = Math.round(
        (departure.getTime() - now.getTime()) / 1000
    );

    const minutes = Math.round(seconds / 60);

    if (minutes <= 0) {
        return "Nu";
    }

    return minutes + " min";
}


/*
 * Försök hitta rätt tunnelbaneavgångar.
 */
async function loadDepartures() {

    const container =
        document.getElementById("departures");

    try {

        const response = await fetch(API, {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error(
                "SL API returned " + response.status
            );
        }

        const data = await response.json();

        /*
         * SL:s API grupperar avgångar efter transporttyp.
         * Tunnelbana ligger normalt i "departures".
         */

        let departures = [];

        if (Array.isArray(data.departures)) {
            departures = data.departures;
        }

        /*
         * Om API:t returnerar ett annat format,
         * försök även läsa metro-arrayen.
         */

        if (
            departures.length === 0 &&
            Array.isArray(data.metro)
        ) {
            departures = data.metro;
        }


        /*
         * Endast:
         * 17
         * 18
         * 19
         */
        departures = departures.filter(function(d) {

            const line =
                String(
                    d.line?.designation ??
                    d.line?.name ??
                    d.designation ??
                    ""
                );

            return ["17", "18", "19"].includes(line);
        });


        /*
         * Endast Hässelby strand / Vällingby.
         */
        departures = departures.filter(function(d) {

            const destination =
                String(
                    d.destination ??
                    d.direction ??
                    d.stopPoint?.name ??
                    ""
                ).toLowerCase();

            return (
                destination.includes("hässelby strand") ||
                destination.includes("vällingby")
            );
        });


        /*
         * Använd expected (realtid) först.
         * Om expected saknas används planned.
         */
        departures = departures
            .map(function(d) {

                const time =
                    d.expected ??
                    d.planned ??
                    d.departure_time ??
                    d.time;

                return {
                    original: d,
                    time: time
                };

            })
            .filter(function(d) {

                return d.time &&
                       !isNaN(
                           new Date(d.time).getTime()
                       );

            });


        /*
         * Sortera närmaste först.
         */
        departures.sort(function(a, b) {

            return new Date(a.time) -
                   new Date(b.time);

        });


        /*
         * Visa endast 4.
         */
        departures =
            departures.slice(0, 4);


        /*
         * Visa resultatet.
         */
        if (departures.length === 0) {

            container.innerHTML =
                '<div class="error">' +
                'Inga avgångar hittades' +
                '</div>';

            return;
        }


        container.innerHTML = "";


        departures.forEach(function(item) {

            const d = item.original;

            const line =
                String(
                    d.line?.designation ??
                    d.line?.name ??
                    d.designation ??
                    "?"
                );

            const destination =
                String(
                    d.destination ??
                    d.direction ??
                    ""
                );

            const formatted =
                formatTime(item.time);


            const row =
                document.createElement("div");

            row.className = "departure";


            const isNow =
                formatted === "Nu";


            row.innerHTML = `
                <div class="line">${line}</div>

                <div class="destination">
                    ${destination}
                </div>

                <div class="time ${isNow ? "now" : ""}">
                    ${formatted}
                </div>
            `;


            container.appendChild(row);

        });

    }

    catch (error) {

        console.error(error);

        /*
         * WidgetWeb kan visa detta i Developer Mode.
         */
        if (typeof __wweb2Log === "function") {
            __wweb2Log(
                "SL API error: " + error.message
            );
        }

        container.innerHTML =
            '<div class="error">' +
            'Kunde inte hämta SL:s avgångar' +
            '</div>';
    }
}


/*
 * Starta.
 */
loadDepartures();

</script>

</body>
</html>
