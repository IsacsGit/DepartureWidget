<!DOCTYPE html>
<html lang="sv">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Västergöksvägen → Blackeberg</title>
<style>
* {
    box-sizing: border-box;
}

:root {
    --bg-main: #0b0f17;
    --surface: #141b26;
    --surface-card: #1b2331;
    --surface-hover: #222d3f;
    --text-main: #f0f6fc;
    --text-muted: #8b949e;
    --border-color: #2d3748;
    --accent-blue: #3b82f6;
    --sl-cyan: #0089cf;
    --sl-blue: #004d9b;
    --sl-green: #008751;
    --sl-bus: #1d2633;
}

html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg-main);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

.app {
    width: 100%;
    max-width: 680px;
    margin: auto;
    min-height: 100vh;
    padding-bottom: 50px;
}

/* APP HEADER */
.sl-header {
    position: sticky;
    top: 0;
    z-index: 30;
    background: rgba(11, 15, 23, 0.88);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    padding: 20px;
    border-bottom: 1px solid var(--border-color);
}

.sl-header-inner {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.route-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -0.3px;
}

.route-title .arrow {
    color: var(--accent-blue);
}

.route-subtitle {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.6px;
}

/* CONTAINER */
.container {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
}

/* JOURNEY CARD (SL STYLE) */
.journey-item {
    background: var(--surface-card);
    border: 1px solid var(--border-color);
    border-radius: 18px;
    padding: 18px;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 20px rgba(0,0,0,0.25);
}

.journey-item:hover {
    background: var(--surface-hover);
    border-color: var(--text-muted);
    transform: translateY(-2px);
}

.journey-top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
}

.times-group {
    display: flex;
    align-items: baseline;
    gap: 8px;
}

.main-time {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.5px;
}

.time-sep {
    color: var(--text-muted);
    font-weight: 600;
}

.duration-pill {
    background: rgba(59, 130, 246, 0.15);
    color: #60a5fa;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
}

.stations-path-label {
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
}

.stations-path-label strong {
    color: var(--text-main);
}

/* BADGES ROW */
.badges-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
}

.transport-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    background: var(--sl-bus);
    border: 1px solid var(--border-color);
}

.transport-badge.metro {
    background: rgba(0, 135, 81, 0.2);
    border-color: rgba(0, 135, 81, 0.5);
    color: #4ade80;
}

.transport-badge.walk {
    background: #212c3d;
    color: var(--text-muted);
    font-weight: 500;
}

.badge-arrow {
    color: var(--text-muted);
    font-size: 12px;
}

/* LOADING & ERROR STATES */
.loading-box {
    padding: 60px 20px;
    text-align: center;
    color: var(--text-muted);
    font-weight: 500;
}

.spinner {
    width: 34px;
    height: 34px;
    margin: 0 auto 16px;
    border: 3px solid var(--border-color);
    border-top-color: var(--accent-blue);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.error-box {
    margin: 20px 16px;
    padding: 18px;
    border-radius: 14px;
    background: rgba(239, 68, 68, 0.12);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #f87171;
    font-size: 14px;
}

/* DETAIL VIEW */
.detail-view {
    display: none;
    padding: 16px;
}

.detail-view.visible {
    display: block;
}

.list-view.hidden {
    display: none;
}

.back-action-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--border-color);
    background: var(--surface-card);
    color: var(--accent-blue);
    font-size: 14px;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 10px;
    margin-bottom: 20px;
    cursor: pointer;
    transition: background 0.15s;
}

.back-action-btn:hover {
    background: var(--surface-hover);
}

.detail-top-card {
    background: var(--surface-card);
    border: 1px solid var(--border-color);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 24px;
}

.detail-main-title {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 4px;
}

.detail-main-sub {
    font-size: 13px;
    color: var(--text-muted);
}

/* DETAILED TIMELINE (SL ROUTE PLANNER STYLE) */
.sl-timeline {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.sl-leg-card {
    background: var(--surface-card);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 18px;
    position: relative;
}

.sl-leg-card.metro-leg {
    border-left: 4px solid var(--sl-green);
}

.sl-leg-card.bus-leg {
    border-left: 4px solid var(--sl-cyan);
}

.sl-leg-card.walk-leg {
    border-left: 4px solid var(--text-muted);
}

.leg-header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.leg-title-text {
    font-size: 16px;
    font-weight: 700;
}

.leg-badge {
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
    background: var(--bg-main);
    border: 1px solid var(--border-color);
}

.leg-stops-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 10px;
    padding-left: 10px;
    border-left: 2px solid var(--border-color);
}

.stop-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
}

.stop-time {
    font-weight: 700;
    color: var(--text-muted);
    min-width: 45px;
}

.stop-name {
    flex: 1;
    color: var(--text-main);
    padding-left: 10px;
}

.intermediate-toggle {
    margin-top: 10px;
    background: none;
    border: none;
    color: var(--accent-blue);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    padding: 0;
    display: inline-flex;
    align-items: center;
    gap: 4px;
}

.intermediate-stops-container {
    display: none;
    flex-direction: column;
    gap: 8px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--border-color);
}

.intermediate-stops-container.open {
    display: flex;
}

.transfer-banner {
    padding: 10px 14px;
    background: rgba(245, 158, 11, 0.1);
    border: 1px solid rgba(245, 158, 11, 0.3);
    color: #fbbf24;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    margin: 8px 0;
    display: flex;
    align-items: center;
    gap: 8px;
}

.footer-info {
    margin-top: 30px;
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    border-top: 1px solid var(--border-color);
    padding-top: 20px;
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header class="sl-header">
        <div class="sl-header-inner">
            <div class="route-title">
                <span>Västergöksvägen</span>
                <span class="arrow">→</span>
                <span>Blackeberg</span>
            </div>
            <div class="route-subtitle">SL Reseplanerare · Liveuppdaterad</div>
        </div>
    </header>

    <!-- LIST VIEW -->
    <main id="listView" class="list-view">
        <div id="journeysContainer" class="container">
            <div class="loading-box">
                <div class="spinner"></div>
                Hämtar SL-resor från ResRobot...
            </div>
        </div>
    </main>

    <!-- DETAIL VIEW -->
    <main id="detailView" class="detail-view">
        <button id="backButton" class="back-action-btn">
            ← Tillbaka till reselista
        </button>

        <div class="detail-top-card">
            <div id="detailMainTitle" class="detail-main-title">Resedetaljer</div>
            <div id="detailMainSub" class="detail-main-sub">Detaljerad översikt av färdväg, byten och hållplatser</div>
        </div>

        <div id="slTimelineContainer" class="sl-timeline"></div>

        <div class="footer-info">
            Resinformation levereras via ResRobot API. Trafikförändringar kan förekomma.
        </div>
    </main>

</div>

<script>
const WORKER = "https://sl-transit-proxy.haxxerlikeshaxx.workers.dev";
let cachedJourneys = [];

function cleanStationName(name) {
    if (!name) return "";
    return name.replace(/\s*\(Stockholm kn\)/gi, "").trim();
}

function cleanTime(timeStr) {
    if (!timeStr) return "";
    const parts = timeStr.split(":");
    return parts.length >= 2 ? `${parts[0]}:${parts[1]}` : timeStr;
}

function escapeHTML(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function calculateDuration(startStr, endStr) {
    try {
        const start = new Date(startStr);
        const end = new Date(endStr);
        const diffMinutes = Math.round((end - start) / 60000);
        return isNaN(diffMinutes) ? null : diffMinutes;
    } catch {
        return null;
    }
}

function getProduct(leg) {
    return Array.isArray(leg.Product) ? leg.Product[0] : leg.Product;
}

function getLineNumber(leg) {
    const p = getProduct(leg);
    if (!p) return "";
    return p.num || p.line || p.name || "";
}

function checkIfMetro(leg) {
    const p = getProduct(leg);
    const cat = (p?.catOutS || p?.catOut || p?.cat || p?.name || "").toLowerCase();
    return cat.includes("metro") || cat.includes("tunnel") || cat.includes("ult");
}

/* RENDER LIST OF JOURNEYS */
function renderJourneyList() {
    const container = document.getElementById("journeysContainer");
    container.innerHTML = "";

    if (!cachedJourneys.length) {
        container.innerHTML = `<div class="error-box">Inga resor hittades för denna rutt just nu.</div>`;
        return;
    }

    cachedJourneys.forEach((trip) => {
        const legs = trip.LegList?.Leg || [];
        const firstLeg = legs[0];
        const lastLeg = legs[legs.length - 1];

        if (!firstLeg || !lastLeg) return;

        const origin = firstLeg.Origin;
        const destination = lastLeg.Destination;

        const startT = cleanTime(origin.time);
        const endT = cleanTime(destination.time);
        const totalDuration = calculateDuration(`${origin.date}T${origin.time}`, `${destination.date}T${destination.time}`);

        let badgesHTML = "";
        const activeLegs = legs.filter(l => l.type === "JNY" || l.type === "WALK");

        activeLegs.forEach((leg, i) => {
            if (i > 0) badgesHTML += `<span class="badge-arrow">›</span>`;

            if (leg.type === "WALK") {
                const walkSeconds = parseInt(leg.duration?.replace(/\D/g,'')) || 180;
                const walkMin = Math.max(1, Math.round(walkSeconds / 60));
                badgesHTML += `<span class="transport-badge walk">Gå (${walkMin} min)</span>`;
            } else {
                const line = getLineNumber(leg);
                const isT = checkIfMetro(leg);
                const typeLabel = isT ? "T-bana" : "Buss";
                badgesHTML += `<span class="transport-badge ${isT ? 'metro' : ''}">${typeLabel} ${escapeHTML(line)}</span>`;
            }
        });

        const card = document.createElement("div");
        card.className = "journey-item";
        card.innerHTML = `
            <div class="journey-top-row">
                <div class="times-group">
                    <span class="main-time">${startT}</span>
                    <span class="time-sep">→</span>
                    <span class="main-time">${endT}</span>
                </div>
                <div class="duration-pill">
                    ${totalDuration !== null ? totalDuration + ' min' : ''}
                </div>
            </div>

            <div class="stations-path-label">
                <span>Från: <strong>${escapeHTML(cleanStationName(origin.name))}</strong></span>
            </div>

            <div class="badges-row">
                ${badgesHTML}
            </div>
        `;

        card.addEventListener("click", () => renderDetailView(trip));
        container.appendChild(card);
    });
}

/* RENDER DETAILED VIEW (SL STYLE) */
function renderDetailView(trip) {
    const listView = document.getElementById("listView");
    const detailView = document.getElementById("detailView");
    const mainTitle = document.getElementById("detailMainTitle");
    const mainSub = document.getElementById("detailMainSub");
    const timelineContainer = document.getElementById("slTimelineContainer");

    const legs = trip.LegList?.Leg || [];
    const origin = legs[0]?.Origin;
    const destination = legs[legs.length - 1]?.Destination;

    mainTitle.textContent = `${cleanTime(origin?.time)} → ${cleanTime(destination?.time)}`;
    mainSub.textContent = `${cleanStationName(origin?.name)} till ${cleanStationName(destination?.name)}`;

    let html = "";

    legs.forEach((leg, idx) => {
        if (leg.type === "TRSF") return;
        if (leg.type !== "JNY" && leg.type !== "WALK") return;

        const legOrigin = leg.Origin;
        const legDestination = leg.Destination;
        if (!legOrigin || !legDestination) return;

        const depTime = cleanTime(legOrigin.time);
        const arrTime = cleanTime(legDestination.time);
        const durationMin = calculateDuration(`${legOrigin.date}T${legOrigin.time}`, `${legDestination.date}T${legDestination.time}`);

        if (leg.type === "WALK") {
            html += `
                <div class="sl-leg-card walk-leg">
                    <div class="leg-header-row">
                        <span class="leg-title-text">Promenad</span>
                        <span class="leg-badge">${durationMin !== null ? durationMin + ' min' : ''}</span>
                    </div>
                    <div class="leg-stops-list">
                        <div class="stop-row">
                            <span class="stop-time">${depTime}</span>
                            <span class="stop-name">Avresa från ${escapeHTML(cleanStationName(legOrigin.name))}</span>
                        </div>
                        <div class="stop-row">
                            <span class="stop-time">${arrTime}</span>
                            <span class="stop-name">Ankomst till ${escapeHTML(cleanStationName(legDestination.name))}</span>
                        </div>
                    </div>
                </div>
            `;
        } else {
            const isT = checkIfMetro(leg);
            const line = getLineNumber(leg);
            const transportType = isT ? "Tunnelbana" : "Buss";
            const direction = leg.direction ? `mot ${escapeHTML(cleanStationName(leg.direction))}` : "";
            
            // Extract intermediate stops if available
            const intermediateStops = leg.Stops?.Stop || [];
            const hasStops = intermediateStops.length > 2;
            const middleStops = intermediateStops.slice(1, intermediateStops.length - 1);

            let intermediateHTML = "";
            if (hasStops) {
                let innerStopsList = "";
                middleStops.forEach(st => {
                    innerStopsList += `
                        <div class="stop-row">
                            <span class="stop-time">${cleanTime(st.depTime || st.arrTime)}</span>
                            <span class="stop-name">${escapeHTML(cleanStationName(st.name))}</span>
                        </div>
                    `;
                });

                intermediateHTML = `
                    <button class="intermediate-toggle" onclick="toggleStops(this)">
                        <span>Visa ${middleStops.length} mellanliggande hållplatser</span>
                        <span>▼</span>
                    </button>
                    <div class="intermediate-stops-container">
                        ${innerStopsList}
                    </div>
                `;
            }

            html += `
                <div class="sl-leg-card ${isT ? 'metro-leg' : 'bus-leg'}">
                    <div class="leg-header-row">
                        <span class="leg-title-text">${transportType} ${escapeHTML(line)}</span>
                        <span class="leg-badge">${durationMin !== null ? durationMin + ' min' : ''}</span>
                    </div>
                    
                    <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 10px;">
                        Färdväg ${direction}
                    </div>

                    <div class="leg-stops-list">
                        <div class="stop-row">
                            <span class="stop-time">${depTime}</span>
                            <span class="stop-name"><strong>${escapeHTML(cleanStationName(legOrigin.name))}</strong></span>
                        </div>
                        
                        ${intermediateHTML}

                        <div class="stop-row" style="margin-top: 8px;">
                            <span class="stop-time">${arrTime}</span>
                            <span class="stop-name"><strong>${escapeHTML(cleanStationName(legDestination.name))}</strong></span>
                        </div>
                    </div>
                </div>
            `;
        }

        // Check for transfer timing to the next leg
        const nextLeg = legs[idx + 1];
        if (nextLeg && nextLeg.type !== "TRSF") {
            const nextOrigin = nextLeg.Origin;
            if (nextOrigin && nextOrigin.time && legDestination.time) {
                const transferTime = calculateDuration(`${legDestination.date}T${legDestination.time}`, `${nextOrigin.date}T${nextOrigin.time}`);
                if (transferTime !== null && transferTime > 0) {
                    html += `
                        <div class="transfer-banner">
                            ⇄ Byte vid ${escapeHTML(cleanStationName(legDestination.name))} · Väntetid ${transferTime} min
                        </div>
                    `;
                }
            }
        }
    });

    timelineContainer.innerHTML = html;
    listView.classList.add("hidden");
    detailView.classList.add("visible");
    window.scrollTo({ top: 0, behavior: "smooth" });
}

/* TOGGLE INTERMEDIATE STOPS */
window.toggleStops = function(button) {
    const container = button.nextElementSibling;
    container.classList.toggle("open");
    button.querySelector("span:last-child").textContent = container.classList.contains("open") ? "▲" : "▼";
}

document.getElementById("backButton").addEventListener("click", () => {
    document.getElementById("detailView").classList.remove("visible");
    document.getElementById("listView").classList.remove("hidden");
});

async function fetchJourneys() {
    const container = document.getElementById("journeysContainer");
    try {
        const res = await fetch(WORKER + "/resrobot/trips");
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        
        const data = await res.json();
        cachedJourneys = data.Trip || data.TripList?.Trip || [];
        if (!Array.isArray(cachedJourneys) && cachedJourneys) cachedJourneys = [cachedJourneys];

        renderJourneyList();
    } catch (err) {
        console.error(err);
        container.innerHTML = `
            <div class="error-box">
                <strong>Kunde inte hämta resor</strong><br><br>
                ${escapeHTML(err.message)}
            </div>
        `;
    }
}

fetchJourneys();
setInterval(fetchJourneys, 60 * 1000);
</script>

</body>
</html>
